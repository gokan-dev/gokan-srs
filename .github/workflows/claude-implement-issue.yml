# Runs Claude to implement an issue the moment it is labeled `ready-for-dev`,
# opening a normal (non-draft) PR when done. Fully event-driven: this workflow
# only exists while GitHub is delivering the `issues: labeled` event, so it does
# no work when there is nothing labeled.
name: "Agent: implement issue"
# Carries the issue number so claude-resume.yml can find it on a finished run, and so a dispatched
# resume/sprint run is legible in the Actions list.
run-name: "Agent: implement issue #${{ github.event.issue.number || inputs.issue }}"

on:
  issues:
    types: [labeled]
  # Re-invoked to continue an interrupted run (claude-resume.yml / claude-sweep.yml, via the
  # resume-issue action) and to start a sprint member against a release branch
  # (claude-start-release.yml). `base` is the branch the work is cut from and the PR targets;
  # it defaults to `main`, which is the single-issue flow, so the label trigger is unchanged.
  workflow_dispatch:
    inputs:
      issue:
        description: "The issue number to implement."
        required: true
      base:
        description: "Branch to base the work on and open the PR against."
        required: false
        default: main

# Prevent two runs racing on the same issue (e.g. label removed + re-added).
concurrency:
  group: claude-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    # The label the maintainer applies, or a dispatched resume / sprint-member start.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    # One agent per branch at a time (AGENTS.md): every agent job that can push queues here. The
    # PR reviewer queues behind this run when the PR opens, so it reviews the finished branch.
    concurrency:
      group: agent-branch-agent/issue-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
      queue: max
    # A large issue runs for hours. Set explicitly rather than relying on GitHub's
    # 360-minute default, so the ceiling is visible next to --max-turns below.
    timeout-minutes: 300
    permissions:
      contents: write       # create branch + push commits
      pull-requests: write  # open the PR
      issues: write         # comment status back on the issue
      id-token: write       # OIDC exchange for the Claude GitHub App token (fallback, see github_token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true   # gokan-dataset submodule, per AGENTS.md
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Claude-side auth. With `/install-github-app` on a Claude subscription this is an
          # OAuth token; swap to anthropic_api_key if you use a metered API key instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          #
          # GitHub-side auth: a fine-grained personal access token scoped to this repo
          # (contents, pull requests, issues: read and write; no workflows permission) and to
          # gokan-dataset (contents: read and write). Keep both: dataset changes are pushed to
          # gokan-dataset with it, here and by claude-address-feedback.yml's submodule step.
          # Without it the action falls back to the Claude GitHub App's installation
          # token, which expires one hour after the run starts: issue #115's first run
          # went 64 minutes, so every push, the PR, the tag and the final comment after
          # the hour failed with 401 Bad credentials. Like the app token (and unlike the
          # default GITHUB_TOKEN), a PAT's pushes, PRs and tags DO trigger downstream
          # workflows, so the PR still gets CI and the tag still deploys to staging.
          # Commits stay authored as claude[bot] (the action's bot_name default); the
          # issue comments, labels and PR appear under the token owner's account.
          # An unset secret is an empty string, which selects the app-token fallback.
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          prompt: |
            You are implementing issue #${{ github.event.issue.number || inputs.issue }} on the base branch
            `${{ inputs.base || 'main' }}` (usually `main`; a release branch during a sprint). Everywhere
            below that says `main` as the branch to build on, sync with and open the PR against, use that base.
            You are working autonomously, no human is present. AGENTS.md is already in your context
            (CLAUDE.md imports it): every rule in it applies from the first line you write. Read
            the docs/ARCHITECTURE.md sections for the area the issue touches, and only those
            (AGENTS.md says how).

            The branch for this issue is ALWAYS `agent/issue-${{ github.event.issue.number || inputs.issue }}`
            (deterministic, no slug suffix), so an interrupted run can be resumed on it.

            0. Run `git fetch origin`, then check whether `agent/issue-${{ github.event.issue.number || inputs.issue }}`
               already exists on origin. If it does, a previous run was interrupted before finishing:
               check it out and CONTINUE from where it left off (read its recent commits and any open
               PR to see what's already done) instead of starting over. If it does not exist, create it
               from the latest `${{ inputs.base || 'main' }}`. EITHER WAY, before writing a single line of code, run
               `git push -u origin agent/issue-${{ github.event.issue.number || inputs.issue }}` so the branch exists on
               origin from the very start, runs get cut off (turn limit, usage limit) with no warning,
               and only pushed work survives.
            1. If the issue (plus AGENTS.md, docs/ARCHITECTURE.md and existing conventions) leaves a LOAD-BEARING
               product/architecture decision genuinely undecided, not just an implementation
               detail you can reasonably choose, do NOT guess. Remove the `ready-for-dev`
               label, add `needs-precision`, comment the specific open questions, and stop.
            2. Otherwise implement it end to end on that branch, following existing conventions.
               COMMIT VERY FREQUENTLY in small batches and `git push` after every commit, after each
               file or small coherent change, NOT just at big milestones. Err deliberately on the side
               of too many tiny commits: each push is a checkpoint, and if the run is cut off (turn
               limit, usage limit) the next run can only resume from what you already pushed, so any
               unpushed work is lost work. Do not worry about a messy commit history while building,
               once the feature is complete and tests pass, you MAY squash your own checkpoint commits
               into a clean set before opening the PR if you prefer. Squashing YOUR OWN commits on this
               branch is allowed; the "never force-push" hard rule only protects commits you did not
               create. Update docs/ARCHITECTURE.md if you make functional changes.
            3. Write/update tests for what you change. Make these pass before opening the PR:
               `bun run check` (conventions, lint, typecheck, tests, duplicates, unused code).
               It must be fully green: never relax a rule, disable a lint or add an exemption to pass.
            4. Open a PULL REQUEST against `${{ inputs.base || 'main' }}`, NOT a draft, with `Closes
               #${{ github.event.issue.number || inputs.issue }}` in the body (reuse the existing PR if one is
               already open for this branch), a concise summary of what changed and what you tested.
               Then remove `ready-for-dev` and add `pr-open`.
            5. If you genuinely cannot make CI green, comment on the issue explaining the
               blocker rather than opening a broken PR.
            6. Before you finish, sync with the base branch `${{ inputs.base || 'main' }}` so the branch is
               deployable against the current state of the repo, not whatever it branched from: `git fetch
               origin ${{ inputs.base || 'main' }} && git merge origin/${{ inputs.base || 'main' }}` (resolve
               conflicts if any arise, they're real integration work, not something to paper over). If this PR touches the
               `apps/gokan-srs/dataset` submodule, ALSO check whether the submodule's own remote
               has moved past what you last pointed it at, merging gokan-srs's own `main` does
               NOT automatically do this, since the submodule pointer only moves when something
               commits a new pointer value: `git -C apps/gokan-srs/dataset fetch origin main &&
               git -C apps/gokan-srs/dataset log HEAD..origin/main --oneline`. If that shows
               anything, decide whether picking it up is in scope for this issue; if yes, and
               this PR has its own dataset branch (the pointer holds commits that are not on the
               dataset's `main`), merge `origin/main` into that branch inside the submodule, push
               it and commit the new pointer: checking out `origin/main` would drop this PR's
               dataset commits. Otherwise `git -C apps/gokan-srs/dataset checkout origin/main &&
               git add apps/gokan-srs/dataset` and commit the bump. Re-run `bun run check` and
               `bun run build` after any merge/bump, don't push a build you haven't re-verified.
            7. Do not tag. When the PR review of your final push is in, the review workflow tags
               an rc for staging itself if the change reaches the deployed apps.

            Hard rules: never push to or merge `main` or the base branch directly (always through the PR);
            never force-push commits you didn't
            create; never touch `.github/workflows/`, secrets, or deployment config; never
            close the issue directly (let the merged PR's `Closes #N` do it); never write
            the string `@claude` in a comment, PR body or commit message (your comments are
            posted as a repo owner, and that string starts the other agent workflows).
          # Posts an immediate tracking comment on the issue with a live-updating
          # checklist as the agent works, replaced with the final summary on
          # completion - restores the visibility the default @claude-mention
          # trigger has, which a custom `prompt` input suppresses by default.
          # A dispatched run (resume, sweep, sprint orchestration) is initiated by github.token, so
          # its actor is github-actions[bot]; the action refuses a bot-initiated run unless it is
          # listed. No loop risk: these are our own workflow_dispatch invocations.
          allowed_bots: "github-actions,claude"
          # Only the `issues` trigger supports it (it posts a checklist on the issue). On a
          # workflow_dispatch resume/sprint start the action rejects it outright, so gate it.
          track_progress: ${{ github.event_name == 'issues' }}
          # 500 turns ended issue #115's first run a third of the way through. The
          # job timeout above is the real ceiling; a cut-off run resumes on its branch.
          claude_args: "--model claude-opus-5-5 --max-turns 1500 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

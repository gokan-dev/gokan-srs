# Runs Claude to respond to human feedback on a PR: a submitted review that is
# not an approval, a PR-level comment, or an inline review comment. Fires only
# when a person leaves feedback AND explicitly opts that feedback in - either by
# @claude-mentioning the agent in the comment/review, or by the PR carrying the
# `agent-feedback` label (an opt-in switch for the whole PR, so every subsequent
# trusted comment/review triggers the agent without needing @claude every time).
# Without one of those two, the event is ignored - this used to fire on every
# trusted comment/review unconditionally, which caused problems when feedback
# wasn't meant for the agent.
name: "Agent: address PR feedback"

on:
  pull_request_review:
    types: [submitted]
  issue_comment:            # top-level PR comments (issue_comment fires for PRs too)
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One run per PR; a newer *human* comment supersedes an in-flight one.
  # The agent's own track_progress comment ("Claude Code is working...") is an
  # issue_comment:created event too, so it re-triggers this workflow while the
  # real run is still going. Left in the shared group, cancel-in-progress would
  # make that bot comment cancel the very run that posted it (the new run then
  # skips via the `if` below, so nothing completes). Giving bot-authored comment
  # events a unique group keeps them from ever cancelling a live human-triggered run.
  # The staging reviewer's status comment (marked `gokan-agent-status`) is posted as a member and
  # is not feedback either: it gets its own group too, so it never cancels a human-triggered run
  # waiting for the branch lock.
  group: claude-feedback-${{ github.event.pull_request.number || github.event.issue.number }}${{ (github.event.comment.user.type == 'Bot' || contains(github.event.comment.body, '<!-- gokan-agent-status -->')) && format('-bot-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # The PR's branch, for the branch lock on `respond`: an issue_comment event does not carry it.
  # The gate is on this job, and `respond` runs only when this one does.
  branch:
    # Gate each event type on TWO independent things:
    #   1. Trusted author. On a public repo anyone can comment/review, so we require
    #      author_association to be a repo owner/member/collaborator - this both keeps
    #      random users from driving the agent (prompt injection / resource abuse) and
    #      excludes the agent's own bot comments (which are never MEMBER), preventing loops.
    #   2. Explicit opt-in: the triggering comment/review body contains "@claude", OR
    #      the PR already carries the `agent-feedback` label. Without this, the workflow
    #      fired on every trusted comment/review unconditionally - which caused problems
    #      when a comment wasn't meant for the agent. The label is a per-PR switch (apply
    #      it once, every later trusted comment/review triggers the agent); "@claude" is
    #      a one-off invocation on a PR that isn't labeled.
    #   - reviews: not an approval (changes requested / commented) + trusted author + opt-in
    #   - comments: on a PR (not a plain issue) + trusted author + opt-in, and not the
    #     staging reviewer's status comment (posted with a member's token, so only its
    #     `gokan-agent-status` marker tells it apart)
    # While a PR waits on the maintainer's choice (`needs-decision`, claude-triage.yml), the
    # label opt-in does not apply: their answer goes through the triage relay, which mentions
    # the agent itself.
    if: >
      (github.event_name == 'pull_request_review' &&
        github.event.review.state != 'approved' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        (contains(github.event.review.body, '@claude') ||
          (contains(github.event.pull_request.labels.*.name, 'agent-feedback') && !contains(github.event.pull_request.labels.*.name, 'needs-decision')))) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, '<!-- gokan-agent-status -->') &&
        (contains(github.event.comment.body, '@claude') ||
          (contains(github.event.issue.labels.*.name, 'agent-feedback') && !contains(github.event.issue.labels.*.name, 'needs-decision')))) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '@claude') ||
          (contains(github.event.pull_request.labels.*.name, 'agent-feedback') && !contains(github.event.pull_request.labels.*.name, 'needs-decision'))))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      name: ${{ steps.pr.outputs.branch }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Find the PR's branch and base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName)"
          echo "branch=$(jq -r .headRefName <<<"$info")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefName <<<"$info")" >> "$GITHUB_OUTPUT"

  respond:
    needs: branch
    runs-on: ubuntu-latest
    # One agent per branch at a time (AGENTS.md): every agent job that can push queues here.
    concurrency:
      group: agent-branch-${{ needs.branch.outputs.name }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write          # required for track_progress's tracking comment
      id-token: write       # OIDC exchange for the Claude GitHub App installation token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Feedback on a dataset change is pushed to gokan-dataset first (AGENTS.md), but this job's
      # tokens reach gokan-srs only: the checkout leaves the submodule on GITHUB_TOKEN, and the
      # Claude app token is scoped to this repo (PR #136: 403 "denied to github-actions[bot]",
      # and the rebuilt dataset was lost with the runner). So the submodule alone pushes with
      # AGENT_GITHUB_TOKEN, as claude-implement-issue.yml's does. Not the whole action: with the
      # PAT its progress comment would be a member's, which cancels this very run (concurrency
      # group above) and, on an `agent-feedback` PR, starts another.
      - name: Let the dataset submodule push
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          DATASET: apps/gokan-srs/dataset
          KEY: http.https://github.com/.extraheader
        run: |
          if [ -z "$AGENT_GITHUB_TOKEN" ]; then
            echo "::warning::AGENT_GITHUB_TOKEN is not set: the agent cannot push dataset changes."
            exit 0
          fi
          # The checkout's header sits in the submodule's config or, in newer checkouts, in a file
          # that config includes. Git would send both Authorization headers, so it goes everywhere.
          # That included file can be shared with gokan-srs itself, whose GITHUB_TOKEN header then
          # goes too: harmless while claude-code-action replaces gokan-srs's credentials, but a
          # step after this one cannot rely on the checkout's auth. `|| true`: no include is not
          # an error, whatever the shell's pipefail.
          { git -C "$DATASET" config --local --get-regexp '^include(if\..+)?\.path$' 2>/dev/null || true; } | while read -r _ file; do
            git config --file "$file" --unset-all "$KEY" || true
          done
          git -C "$DATASET" config --local --unset-all "$KEY" || true
          auth="$(printf 'x-access-token:%s' "$AGENT_GITHUB_TOKEN" | base64 -w0)"
          git -C "$DATASET" config --local "$KEY" "AUTHORIZATION: basic $auth"
          # A dry run asks GitHub for push access and pushes nothing: a refusal shows in the run
          # summary instead of as a 403 in the middle of the agent's work.
          if ! git -C "$DATASET" push --dry-run --quiet origin HEAD:refs/heads/push-access-check; then
            echo "::warning::gokan-dataset refused AGENT_GITHUB_TOKEN for a push: the agent cannot push dataset changes."
          fi

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub-side auth via the installed Claude GitHub App (see claude-implement-issue.yml);
          # the dataset submodule pushes with AGENT_GITHUB_TOKEN (the step above).
          # The action resolves the PR context from the triggering event automatically;
          # the prompt tells it how to act on that feedback.
          prompt: |
            A reviewer left feedback on this PR. Read the review and all review/PR
            comments in context. For each actionable point, either:
              - make the change on the PR branch (following AGENTS.md, keeping
                bun run check green), or
              - reply explaining why you disagree or need clarification.
            Push any code changes to the same branch and post a brief comment
            summarising how you addressed the feedback. Do not resolve threads you
            did not actually address.

            When the comment that started this run is a triage brief (its first line
            starts with `<!-- gokan-triage`) or relays a decision on one (`<!-- gokan-decision -->`),
            that brief is the whole request: apply its Apply and Decided by default points, and
            for each Your call question, the option the maintainer ticked on the brief or named in their reply,
            with any note they added (the reply wins where the two differ). Leave every point
            under "Not in this change" alone, and do not act on review points the brief does
            not list: the triage already weighed them. If the decision is to stop, or leaves
            nothing to change, push nothing and say so in one line: any push starts another
            review round.

            Never end the session while a command you started is still running: a
            dataset rebuild takes minutes, so run it in the foreground with a long
            timeout, or start it in the background and poll it until it exits. When the
            session ends, the runner and everything not pushed are gone. Commit each
            change as it is done. A dataset change is committed and pushed in the
            submodule first (its branch on gokan-dataset, named like this one), and only
            then is the new pointer committed here: never point at a dataset commit that
            is not on the remote.

            Before you finish, sync with the PR's base branch `${{ needs.branch.outputs.base }}` so the
            branch is deployable against the current state of the repo: `git fetch origin
            ${{ needs.branch.outputs.base }} && git merge origin/${{ needs.branch.outputs.base }}`
            (resolve conflicts if any arise). If this PR touches the
            `apps/gokan-srs/dataset` submodule, ALSO check whether the submodule's own
            remote has moved past what's currently pointed at - merging gokan-srs's own
            `main` does NOT do this automatically: `git -C apps/gokan-srs/dataset fetch
            origin main && git -C apps/gokan-srs/dataset log HEAD..origin/main --oneline`.
            If that shows anything relevant to this PR's changes, bring it in. When this
            PR has its own dataset branch (the pointer holds commits that are not on the
            dataset's `main`), merge `origin/main` into that branch inside the submodule,
            push it, and commit the new pointer: checking out `origin/main` would drop
            this PR's dataset commits. Otherwise bump the pointer (`git -C
            apps/gokan-srs/dataset checkout origin/main && git add
            apps/gokan-srs/dataset`) and commit it. Re-run `bun run check`/
            `build` after any merge/bump.

            Do not tag. When the PR review of your final push is in, the review workflow
            tags an rc for staging itself if the change reaches the deployed apps.
          # Posts an immediate tracking comment on the PR with a live-updating checklist
          # as the agent works, replaced with the final summary on completion - restores
          # the visibility the default @claude-mention trigger has, which a custom
          # `prompt` input suppresses by default. Keeps the single-trigger fix from
          # fix/dedupe-claude-triggers intact - this workflow still only fires once per
          # comment, track_progress just changes how that one run reports back.
          track_progress: true
          claude_args: "--model claude-opus-5-5 --max-turns 500 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

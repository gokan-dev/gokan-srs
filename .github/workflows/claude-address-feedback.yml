# Runs Claude to respond to human feedback on a PR: a submitted review that is
# not an approval, a PR-level comment, or an inline review comment. Fires only
# when a person leaves feedback AND explicitly opts that feedback in - either by
# @claude-mentioning the agent in the comment/review, or by the PR carrying the
# `agent-feedback` label (an opt-in switch for the whole PR, so every subsequent
# trusted comment/review triggers the agent without needing @claude every time).
# Without one of those two, the event is ignored - this used to fire on every
# trusted comment/review unconditionally, which caused problems when feedback
# wasn't meant for the agent.
name: "Agent: address PR feedback"

on:
  pull_request_review:
    types: [submitted]
  issue_comment:            # top-level PR comments (issue_comment fires for PRs too)
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One run per PR; a newer *human* comment supersedes an in-flight one.
  # The agent's own track_progress comment ("Claude Code is working...") is an
  # issue_comment:created event too, so it re-triggers this workflow while the
  # real run is still going. Left in the shared group, cancel-in-progress would
  # make that bot comment cancel the very run that posted it (the new run then
  # skips via the `if` below, so nothing completes). Giving bot-authored comment
  # events a unique group keeps them from ever cancelling a live human-triggered run.
  group: claude-feedback-${{ github.event.pull_request.number || github.event.issue.number }}${{ github.event.comment.user.type == 'Bot' && format('-bot-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  respond:
    # Gate each event type on TWO independent things:
    #   1. Trusted author. On a public repo anyone can comment/review, so we require
    #      author_association to be a repo owner/member/collaborator - this both keeps
    #      random users from driving the agent (prompt injection / resource abuse) and
    #      excludes the agent's own bot comments (which are never MEMBER), preventing loops.
    #   2. Explicit opt-in: the triggering comment/review body contains "@claude", OR
    #      the PR already carries the `agent-feedback` label. Without this, the workflow
    #      fired on every trusted comment/review unconditionally - which caused problems
    #      when a comment wasn't meant for the agent. The label is a per-PR switch (apply
    #      it once, every later trusted comment/review triggers the agent); "@claude" is
    #      a one-off invocation on a PR that isn't labeled.
    #   - reviews: not an approval (changes requested / commented) + trusted author + opt-in
    #   - comments: on a PR (not a plain issue) + trusted author + opt-in
    if: >
      (github.event_name == 'pull_request_review' &&
        github.event.review.state != 'approved' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        (contains(github.event.review.body, '@claude') || contains(github.event.pull_request.labels.*.name, 'agent-feedback'))) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '@claude') || contains(github.event.issue.labels.*.name, 'agent-feedback'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '@claude') || contains(github.event.pull_request.labels.*.name, 'agent-feedback')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write          # required for track_progress's tracking comment
      id-token: write       # OIDC exchange for the Claude GitHub App installation token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub-side auth via the installed Claude GitHub App (see claude-implement-issue.yml).
          # The action resolves the PR context from the triggering event automatically;
          # the prompt tells it how to act on that feedback.
          prompt: |
            A reviewer left feedback on this PR. Read the review and all review/PR
            comments in context. For each actionable point, either:
              - make the change on the PR branch (following AGENTS.md, keeping
                bun run check green), or
              - reply explaining why you disagree or need clarification.
            Push any code changes to the same branch and post a brief comment
            summarising how you addressed the feedback. Do not resolve threads you
            did not actually address.

            Before tagging, sync with `main` so the branch is deployable against the
            current state of the repo: `git fetch origin main && git merge origin/main`
            (resolve conflicts if any arise). If this PR touches the
            `apps/gokan-srs/dataset` submodule, ALSO check whether the submodule's own
            remote has moved past what's currently pointed at - merging gokan-srs's own
            `main` does NOT do this automatically: `git -C apps/gokan-srs/dataset fetch
            origin main && git -C apps/gokan-srs/dataset log HEAD..origin/main --oneline`.
            If that shows anything relevant to this PR's changes, bump the submodule
            pointer (`git -C apps/gokan-srs/dataset checkout origin/main && git add
            apps/gokan-srs/dataset`) and commit it. Re-run `bun run check`/
            `build` after any merge/bump.

            After that, check whether this branch was already staged: `git fetch --tags`
            then `git tag --merged HEAD --list 'v*-rc.*' --sort=-v:refname`. If that
            lists any tag, bump only the trailing rc number by one (e.g. `v1.2.0-rc.4` ->
            `v1.2.0-rc.5`) and tag the new HEAD. If it lists nothing (no prior tag reaches
            this branch - e.g. addressing feedback on a PR that predates the self-tagging
            convention, or opened by a human rather than claude-implement-issue.yml), tag
            it as a fresh release instead: find the highest release tag repo-wide (`git
            tag --list 'v*.*.*-rc.*' --sort=-v:refname | head -1`), bump its MINOR version
            by one, reset to `.0-rc.1`. Either way: `git tag -a <new-tag> -m "..." && git
            push origin <new-tag>`, and only once `bun run check`/`build` all
            pass on the final commit - never tag a broken build.
          # Posts an immediate tracking comment on the PR with a live-updating checklist
          # as the agent works, replaced with the final summary on completion - restores
          # the visibility the default @claude-mention trigger has, which a custom
          # `prompt` input suppresses by default. Keeps the single-trigger fix from
          # fix/dedupe-claude-triggers intact - this workflow still only fires once per
          # comment, track_progress just changes how that one run reports back.
          track_progress: true
          claude_args: "--model claude-sonnet-5 --max-turns 500 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

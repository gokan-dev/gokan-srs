name: "Agent: on-demand assistant"

# Scoped to plain ISSUES only (not PRs) - `@claude` on a PR comment/review is
# claude-address-feedback.yml's job (it has write access to actually push
# changes; this workflow is read-only Q&A). Both workflows used to listen for
# `@claude` on issue_comment/pull_request_review/pull_request_review_comment
# unconditionally, so a PR comment tagging @claude fired both pipelines at
# once - only one would survive concurrency limits, non-deterministically.
# Fixed by making the two mutually exclusive: this one only reacts to
# `issue_comment` when the comment is on a plain issue (`issue.pull_request`
# is null), and drops the pull_request_review*/pull_request_review_comment
# triggers entirely.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # For the usage report after the agent.
      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Allow Bash (and the file tools) so the agent can run typecheck / lint /
          # test / build when a comment asks it to verify changes. Without this the
          # action's default tool set excludes Bash, and every bun/npx invocation is
          # denied ("requires approval"), so verification silently no-ops.
          claude_args: "--model claude-opus-5-5 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

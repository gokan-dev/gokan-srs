# Decides what happens after a round's reviews, so a person is asked only when a choice is theirs.
#
# A round is one pushed commit, reviewed. The reviewers only report, so every point comes here.
# claude-review.yml dispatches this workflow when the PR review is in and the round's changes ship
# nothing (no staging deploy), and claude-review-staging.yml does when the rendered review of the
# round's rc is in. The triage agent reads the round's reviews (and every earlier triage and decision
# on the PR) and writes a brief; the workflow decides from the brief's sections (scripts/triage.ts,
# its rules in scripts/lib/, with tests) exactly one outcome:
#   - done:   nothing left to change. Labels the PR `agent-done` and mentions the human (a sprint
#             member is merged into its release instead).
#   - apply:  a defect to fix, each with one obvious resolution. Posts the brief as a request to
#             claude-address-feedback.yml, which fixes and pushes: a new round.
#   - finish: round 1 left only reversible defaults. The feedback agent applies them, and triage of
#             that push waits for CI, then sorts its PR review with the round 2+ bar (no staging
#             round): done, apply or decide, never another finish.
#   - decide: at least one point needs the human's choice. Posts the brief with the options as
#             checkboxes, labels the PR `needs-decision` and mentions the human.
# The relay job then hands the answer (a ticked Send box, or any reply) to the feedback agent.
#
# Rounds cannot run forever: the brief never raises again what an earlier triage left out or the
# human decided; from round 2 on, polish and lone defaults start no round (they are left on the PR,
# and a sprint's release tracker, for one final pass); after MAX_AUTO_ROUNDS automatic rounds
# without a word from the human, an `apply` becomes a `decide` that offers to stop; and a commit is
# triaged once, plus one repeat after an answer that pushed nothing (an apply or finish brief, or a
# decision), which ends in done or decide.
#
# Only deterministic steps write the "@claude" that starts the feedback agent: the triage agent
# has no shell and no network, reads what the steps gathered, and writes its brief to a file.
name: "Agent: triage reviews"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The PR branch to triage'
        required: true
      sha:
        description: 'The reviewed commit (default: the branch head)'
        required: false
      staging_review:
        description: 'Set by the reviews: the staging review result, or not-needed'
        required: false
      staging_run:
        description: 'Set by the staging review: its run URL'
        required: false
      retriage:
        description: 'Set by claude-address-feedback.yml: "true" when the brief or decision it answered pushed nothing, so this commit gets one more triage (to end in done or decide) instead of the round stalling'
        required: false
  issue_comment:
    types: [created, edited]

env:
  # A person's answer is needed after this many automatic rounds in a row.
  MAX_AUTO_ROUNDS: 2

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A newer round on the branch supersedes this one. No branch lock: this job never pushes.
    concurrency:
      group: claude-triage-${{ inputs.branch }}
      cancel-in-progress: true
    # Up to 45 minutes waiting for the PR review (and, finishing, up to 45 for CI), then the agent.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write  # labels, the outcome comment
      issues: write         # the outcome comment goes through the Issues API
      actions: read         # whether the PR review of this push has finished
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ inputs.branch }}
      SHA_INPUT: ${{ inputs.sha }}
      STAGING_REVIEW: ${{ inputs.staging_review }}
      RETRIAGE: ${{ inputs.retriage }}
      STAGING_RUN: ${{ inputs.staging_run }}
      AGENT_HUMAN: ${{ vars.AGENT_HUMAN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # The gate and the outcome are scripts/triage.ts, run from the default branch (where this
      # workflow comes from): a PR branch cut before them has none. Its own worktree, outside the
      # checkout, so nothing of it is in the PR's tree.
      - name: Checkout the triage scripts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/pipeline" "origin/$DEFAULT_BRANCH"
          echo "PIPELINE=$RUNNER_TEMP/pipeline/scripts" >> "$GITHUB_ENV"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Find the round
        id: round
        run: |
          set -euo pipefail
          stop() { echo "$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,isDraft,author,labels,baseRefName --jq '.[0] // empty')"
          [ -n "$pr_json" ] || stop "No open PR for $BRANCH: nothing to triage."
          pr="$(jq -r .number <<<"$pr_json")"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "human=${AGENT_HUMAN:-$(jq -r .author.login <<<"$pr_json")}" >> "$GITHUB_OUTPUT"
          # The PR's base (usually main; a release branch during a sprint): the diff is read
          # against it, so a member PR's review covers only its own change, not the whole release.
          echo "base=$(jq -r .baseRefName <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          # A draft is still being iterated by hand (the staging reviewer opens drafts for branches
          # tagged without a PR), and the PR reviewer skips drafts, so a round never completes.
          [ "$(jq -r .isDraft <<<"$pr_json")" = false ] || stop "PR #$pr is a draft."
          ! jq -e '.labels | any(.name == "no-triage")' <<<"$pr_json" > /dev/null || stop "PR #$pr opted out (no-triage)."

          case "$STAGING_REVIEW" in
            ''|success|not-needed) ;;
            *) echo "staging_failed=true" >> "$GITHUB_OUTPUT"; stop "The staging review ended with: $STAGING_REVIEW." ;;
          esac

          git fetch --quiet --force --tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          head="$(git rev-parse "origin/$BRANCH")"
          sha="${SHA_INPUT:-$head}"
          # A newer push means a newer round, whose review hands it on in turn.
          [ "$sha" = "$head" ] || stop "$BRANCH moved on from ${sha:0:10} to ${head:0:10}."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(git tag --points-at "$sha" --list 'v*-rc.*' --sort=-v:refname | sed -n 1p)" >> "$GITHUB_OUTPUT"

          # Whether this commit is triaged, and as what: once, but for the one repeat after an answer
          # that pushed nothing (retriage); a round of its own, or the end of a finish
          # (scripts/lib/triageRound.ts, with tests). Writes gate, repeat, finishing, auto_rounds, round.
          export COMMENTS_FILE="$RUNNER_TEMP/comments.jsonl" SHA="$sha"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | {type: .user.type, body}' > "$COMMENTS_FILE"
          bun "$PIPELINE/triage.ts" round
          [ "$(sed -n 's/^gate=//p' "$GITHUB_OUTPUT" | tail -1)" = triage ] || stop "Not triaged."
          finishing="$(sed -n 's/^finishing=//p' "$GITHUB_OUTPUT" | tail -1)"

          # The PR review of this commit: done when the review workflow dispatched this run, still
          # possibly running when a hand-tagged rc's staging review did. Waited for, not assumed.
          deadline=$((SECONDS + 45 * 60))
          while :; do
            read -r total pending failed < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/claude-review.yml/runs?head_sha=$sha" \
              --jq '[.workflow_runs[]] | "\(length) \(map(select(.status != "completed")) | length) \(map(select(.status == "completed" and .conclusion != "success")) | length)"')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The PR review of $sha did not finish within 45 minutes."
              exit 1
            fi
            sleep 60
          done

          # The push of a finish brief has no staging round, so CI is waited for here: a red CI is the
          # fix-CI agent's, and triage of its push takes the finish on. The PR review is still sorted
          # by the agent below, with the round 2+ bar: the reviewer only reports, so a run that
          # succeeded can still hold a regression in how the defaults were applied.
          if [ "$finishing" = true ]; then
            if [ "$failed" -gt 0 ]; then
              echo "::error::The PR review of $sha did not succeed: re-run it, then this triage."
              exit 1
            fi
            set +e
            bun "$PIPELINE/ci-wait.ts" --sha "$sha" --timeout 45
            ci=$?
            set -e
            case "$ci" in
              0) ;;
              1) stop "CI failed on ${sha:0:10}: the fix-CI agent takes it, and triage of its push takes the finish on." ;;
              *) echo "::error::CI on $sha could not be read, or did not finish within 45 minutes."; exit 1 ;;
            esac
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Tell the human the staging review did not finish
        if: steps.round.outputs.staging_failed == 'true'
        env:
          PR: ${{ steps.round.outputs.pr }}
          HUMAN: ${{ steps.round.outputs.human }}
        run: |
          {
            echo "<!-- gokan-notice -->"
            echo "@$HUMAN The staging review of \`$BRANCH\` ended with \`$STAGING_REVIEW\` ($STAGING_RUN), so this round was not triaged."
            echo "Re-run the review, or run **Agent: triage reviews** on \`$BRANCH\` from the Actions tab to triage what is there."
          } > "$RUNNER_TEMP/notice.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"

      # Everything the agent reads, in the workspace (it has no shell and no network). Nothing here
      # is committed: this job never pushes.
      - name: Gather the round
        if: steps.round.outputs.ready == 'true'
        env:
          PR: ${{ steps.round.outputs.pr }}
          HEAD: ${{ steps.round.outputs.sha }}
          BASE: ${{ steps.round.outputs.base }}
        run: |
          set -euo pipefail
          ctx=.triage/context
          mkdir -p "$ctx" .triage/out
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json number,title,body,url,closingIssuesReferences > "$ctx/pr.json"
          for issue in $(jq -r '.closingIssuesReferences[].number' "$ctx/pr.json"); do
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json number,title,body,comments > "$ctx/issue-$issue.json"
          done
          {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --jq '.[] | {at: .created_at, kind: "comment", author: .user.login, url: .html_url, body}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.body != "") | {at: .submitted_at, kind: "review, \(.state)", author: .user.login, url: .html_url, body}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
              --jq '.[] | {at: .created_at, kind: "inline on \(.path):\(.line // .original_line)", author: .user.login, url: .html_url, body}'
          } | jq -rs 'sort_by(.at)[] | "# \(.at), \(.author), \(.kind)\n\(.url)\n\n\(.body)\n"' > "$ctx/conversation.md"
          # Exits non-zero while a check is pending or failing; the list is what matters.
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,state,link > "$ctx/checks.json" || true
          git fetch --quiet --force origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
          git log --format='%h %an: %s' "origin/$BASE..$HEAD" > "$ctx/commits.txt"
          git diff "origin/$BASE...$HEAD" > "$ctx/diff.patch"

      - name: Run Claude
        id: claude
        if: steps.round.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The reviews dispatch this run with their GITHUB_TOKEN, so the actor is a bot.
          allowed_bots: "github-actions,claude"
          prompt: |
            You are triaging the reviews of round ${{ steps.round.outputs.round }} of PR
            #${{ steps.round.outputs.pr }} (branch `${{ inputs.branch }}`, commit
            `${{ steps.round.outputs.sha }}`). You decide
            what happens next, so that the maintainer is asked only for choices that are theirs.
            You do not change code, and you post nothing: you write the brief, and the workflow
            decides from its sections what happens next and acts on it. AGENTS.md is already in your
            context (CLAUDE.md imports it): its rules decide what is a defect.

            What you have, in `.triage/context/`:
              - `pr.json`, and `issue-<n>.json` for the issue the PR closes: the scope.
              - `conversation.md`: every comment, review and inline comment on the PR, oldest first.
              - `checks.json`: the PR's checks. `commits.txt` and `diff.patch`: the change.
            The repository is checked out at the branch head if you need to read a file.

            In `conversation.md`, this round's reviews are the latest PR review (claude[bot]'s
            "Review of PR" comment and its PR review) and, when the round reached staging, the
            staging review of this commit (the comment starting `<!-- gokan-agent-status -->`).
            ${{ inputs.staging_review == 'not-needed' && 'This round changed nothing the deployed apps ship (CI, docs or tests only), so it had no staging deploy: the PR review is its only review, and an older staging review belongs to an earlier round.' || (steps.round.outputs.repeat != '' && inputs.staging_review == '') && 'This round''s reviews are the ones the earlier triage of this commit read (its brief is on the PR: the comment starting `<!-- gokan-triage sha=` with this commit). A staging review counts only if it names this commit; an older one belongs to an earlier round.' || 'This round''s changes reached staging, so it has both reviews.' }}
            ${{ steps.round.outputs.repeat == 'decision' && 'This commit was triaged already, the maintainer answered that brief (the `<!-- gokan-decision -->` relay and the options ticked on the brief), and the feedback agent pushed nothing. If the maintainer chose to stop, or nothing is left to change, the brief is only a summary line (and "Not in this change"): the PR is done.' || steps.round.outputs.repeat != '' && 'This commit was triaged once already, and the feedback agent answered that brief without pushing (its comment says what it changed, if anything: the PR text, or nothing). Judge whether anything is still left to change: if not, the brief is only a summary line (and "Not in this change").' || '' }}
            The reviewers only report, so every point is yours to sort: triage each point in this
            round's reviews, every unresolved inline comment, and any failing check. Earlier
            rounds are history: comments starting `<!-- gokan-triage` are earlier triages, and
            comments from people (and `<!-- gokan-decision -->` relays) are the maintainer's
            decisions.

            Sort each point into exactly one group. The test for "Your call" is whether the
            choice is genuinely the maintainer's to make, which turns on how hard it is to reverse
            and how far it reaches, NOT on whether it is visible: a choice the user sees but that is
            cheap to change later is not something to stop a round for.
              - Apply: in this PR's scope, a real improvement, and a resolution a careful
                maintainer would accept without discussion: a missing test, a stale doc or comment,
                a rule from AGENTS.md or docs/DESIGN_SYSTEM.md broken, a naming inconsistency, the
                check a review says would have caught a finding (the AGENTS.md ratchet), a failing
                check. Apply ALSO absorbs a choice that has several reasonable options but a clear
                recommendation and is cheap to reverse later (a layout direction, spacing, ordering,
                wording, most visual detail): take the recommended option and record it under
                "Decided by default" in the brief, so the maintainer sees what was chosen and can
                object at merge, instead of being stopped mid-round for it.
              - Your call: a decision costly to reverse once shipped (a persisted or stored shape, a
                URL or route, a storage or serialization format, a public API, a dependency,
                anything users build state on), a change of scope or product direction, or a real
                trade-off with no clear recommendation. When unsure whether a choice is cheap to
                reverse, treat it as Your call: the failure to avoid is shipping a consequential,
                hard-to-undo choice to save a rubber-stamp. Give two or three concrete options and
                recommend one.
              - Not in this change: present before this PR, app-wide or in a shared component
                beyond this PR's purpose, a preference no rule backs, a "consider" with no concrete
                harm, or something the review itself judged fine.
            Never raise again a point an earlier triage put under "Not in this change" or one the
            maintainer decided: their decision stands.

            Mark every Apply point `(defect)` or `(polish)` at the end of its heading. A defect is
            wrong as it stands: a broken rule, a bug, a missing test, a stale doc, a failing check,
            a regression in what the previous round changed. Polish would be better but is not
            wrong: wording, formatting, a nicer structure. This is round ${{ steps.round.outputs.round }}.
            The workflow decides from the sections, so mark them honestly: from round 2 on, polish
            and defaults start no round (they are left on the PR for one final pass, and a round of
            only those ends the PR), and in round 1 a brief of only "Decided by default" points is
            applied as the PR's last round, with no staging round after it (the triage of that push
            sorts its PR review with the round 2+ bar).
            ${{ steps.round.outputs.finishing == 'true' && 'This commit is that last push: the feedback agent applied the previous triage''s "Decided by default" points (its brief is the latest comment starting `<!-- gokan-triage sha=` with `outcome=finish`), and CI passed on it. Only a defect in what that push changed (a default applied wrongly, a regression it caused) goes under Apply or Your call; everything else is polish for the final pass, and nothing an earlier triage already sorted is raised again.' || '' }}

            Write `.triage/out/brief.md`, the brief the feedback agent and the maintainer read.
            Markdown, sections in this order, an empty one left out, points numbered across the
            whole brief so an answer can say "2B":

              ## Apply
              ### 1. <what changes, in a few words> (defect)
              <the change, where (file:line), why (the rule or the finding), and the test that goes
              with it: precise enough to act on without opening the reviews.>

              ## Decided by default (reversible)
              ### 2. <the choice>
              Chose <option> because <one line>. Reversible: say so on this PR to change it.

              ## Your call
              ### 3. <the question>
              <the trade-off, in two or three sentences.>
              - [ ] **A**: <option> (recommended)
              - [ ] **B**: <option>

              ## Not in this change
              - <the point, in one line>: <why it stays out>.

            When nothing is left to change, the brief is one line saying what the reviews found, then
            "Not in this change" if it has anything. Write as AGENTS.md says: neutral and direct, no em
            dash. Never write the string `@claude`, and never mention anyone.
          claude_args: "--model claude-opus-5-5 --max-turns 80 --allowedTools Read,Glob,Grep,Write"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

      # What happens next follows from the brief's sections, not from the agent's word for it
      # (scripts/lib/triageOutcome.ts, with tests): decide, apply, finish (round 1, only defaults
      # left: the last round) or done; from round 2 on, and on a finish's push (FINISHING), polish and
      # lone defaults are left for one final pass instead of starting a round.
      - name: Decide the outcome
        id: outcome
        if: steps.round.outputs.ready == 'true'
        env:
          PR: ${{ steps.round.outputs.pr }}
          HUMAN: ${{ steps.round.outputs.human }}
          BASE: ${{ steps.round.outputs.base }}
          TAG: ${{ steps.round.outputs.tag }}
          SHA: ${{ steps.round.outputs.sha }}
          ROUND: ${{ steps.round.outputs.round }}
          AUTO_ROUNDS: ${{ steps.round.outputs.auto_rounds }}
          REPEAT: ${{ steps.round.outputs.repeat }}
          FINISHING: ${{ steps.round.outputs.finishing }}
          BRIEF_FILE: .triage/out/brief.md
        run: |
          set -euo pipefail
          [ -s "$BRIEF_FILE" ] || { echo "::error::The triage wrote no brief."; exit 1; }
          bun "$PIPELINE/triage.ts" outcome

      - name: Post the outcome
        if: steps.round.outputs.ready == 'true'
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR: ${{ steps.round.outputs.pr }}
          HUMAN: ${{ steps.round.outputs.human }}
          BASE: ${{ steps.round.outputs.base }}
          ROUND: ${{ steps.round.outputs.round }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          gh label create needs-decision --repo "$GITHUB_REPOSITORY" --force --color FBCA04 \
            --description "The agents wait for a maintainer's choice"
          gh label create agent-done --repo "$GITHUB_REPOSITORY" --force --color 0E8A16 \
            --description "Reviews leave nothing to change: ready for a maintainer to merge"
          gh label create no-triage --repo "$GITHUB_REPOSITORY" --force --color BFD4F2 \
            --description "Review rounds are not triaged on this PR"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label needs-decision --remove-label agent-done || true

          case "$OUTCOME" in
            apply|finish)
              # The PAT posts as a member, which is what starts claude-address-feedback.yml; a
              # GITHUB_TOKEN comment starts no workflow. This step is the only place the mention
              # that starts the feedback agent is written (the brief's own are defused).
              [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: the brief cannot reach the feedback agent."; exit 1; }
              GH_TOKEN="$AGENT_GITHUB_TOKEN" gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              ;;
            done)
              # Posted on every PR, a sprint member's too (it mentions nobody there): the marker is what
              # the gates read, and the brief keeps what was left for the final pass.
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              if [[ "$BASE" == release/* ]]; then
                # A sprint member: merge it into the release branch so claude-start-release.yml's
                # advance starts the next one. With the PAT, so that merge triggers advance (a
                # GITHUB_TOKEN merge starts no workflow). No maintainer ping: they approve once, at
                # release -> main. A merge that cannot go through is surfaced so the sprint is not
                # silently stuck.
                [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: the member cannot be merged."; exit 1; }
                if GH_TOKEN="$AGENT_GITHUB_TOKEN" gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge; then
                  echo "Merged release member PR #$PR into $BASE." >> "$GITHUB_STEP_SUMMARY"
                else
                  gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "<!-- gokan-notice -->
              @$HUMAN This member is done but could not be merged into \`$BASE\` automatically. Merge it to let the release continue."
                fi
              else
                gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label agent-done
              fi
              ;;
            decide)
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-decision
              ;;
            *) echo "::error::No outcome was decided: '$OUTCOME'."; exit 1 ;;
          esac

          # A sprint member's points left for the final pass go on the release tracker too (the
          # `Release X.Y.Z: ...` issue), where the release PR's pass reads them all at once.
          if [ -s "$RUNNER_TEMP/final-pass.md" ] && [[ "$BASE" == release/* ]]; then
            version="${BASE#release/}"
            tracker="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Release $version:\" in:title" \
              --json number,title --jq "[.[] | select(.title | startswith(\"Release $version:\"))][0].number // empty")"
            if [ -n "$tracker" ]; then
              gh issue comment "$tracker" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/final-pass.md"
            else
              echo "::warning::No open tracker titled \"Release $version: ...\": the final-pass points stay on PR #$PR only."
            fi
          fi
          echo "Round $ROUND of PR #$PR: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Tell the human the triage failed
        if: failure() && steps.round.outputs.pr != ''
        env:
          PR: ${{ steps.round.outputs.pr }}
          HUMAN: ${{ steps.round.outputs.human }}
        run: |
          {
            echo "<!-- gokan-notice -->"
            echo "@$HUMAN Triage of \`$BRANCH\` stopped with an error, so this round was not handed on: $RUN_URL"
          } > "$RUNNER_TEMP/notice.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"

  # Hands the maintainer's answer to a `decide` brief to the feedback agent. Either answer sends:
  # ticking the brief's Send box (only people with write access can edit a comment, so the tick is
  # trusted) or any reply from a member while the PR waits.
  relay:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.issue.labels.*.name, 'needs-decision') &&
      ((github.event.action == 'created' &&
        github.event.comment.user.type == 'User' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, '<!-- gokan-') &&
        !contains(github.event.comment.body, '@claude')) ||
      (github.event.action == 'edited' &&
        startsWith(github.event.comment.body, '<!-- gokan-triage sha=') &&
        contains(github.event.comment.body, 'outcome=decide') &&
        contains(github.event.comment.body, '- [x] **Send my choices to the agent**') &&
        contains(github.event.changes.body.from, '- [ ] **Send my choices to the agent**')))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-decision-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write  # remove the label
      issues: write
    steps:
      - name: Hand the decision to the feedback agent
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          # The label is the lock: the first answer sends; a second (a tick, then a reply) finds it
          # gone and stays conversation.
          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx needs-decision; then
            echo "Already sent."
            exit 0
          fi
          [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: the decision cannot reach the feedback agent."; exit 1; }
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label needs-decision

          if [ "$ACTION" = edited ]; then
            brief="$COMMENT_URL"
            how="the options ticked on it"
          else
            brief="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --jq '.[] | select(.body | test("^<!-- gokan-triage sha=[^>]*outcome=decide")) | .html_url' | tail -1)"
            how="the options ticked on it and [my reply]($COMMENT_URL), which wins where they differ"
          fi
          {
            echo "<!-- gokan-decision -->"
            echo "@claude please apply [the triage brief]($brief) to this branch with my decisions: $how."
          } > "$RUNNER_TEMP/decision.md"
          # The PAT posts as a member, which is what starts claude-address-feedback.yml.
          GH_TOKEN="$AGENT_GITHUB_TOKEN" gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/decision.md"

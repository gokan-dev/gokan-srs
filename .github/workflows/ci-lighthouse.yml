# Lighthouse over both production builds, served locally the way CloudFront serves them, brotli
# included (scripts/check-lighthouse.ts). The gate the dictionary exists for: SEO at 100 on every
# page type, on mobile and desktop. Accessibility and best practices are held at a floor;
# performance is recorded, not gated (it moves between runs; the SRS pages take a median of 3).
# A local build is deterministic, so this runs per PR, like ci-layout.yml: SEO, accessibility and
# best practices are the same markup here as on the CDN. The runner image ships Google Chrome.

name: "CI: Lighthouse"

on:
  push:
    branches: ['**']   # not rc tags: their commit was checked on its branch (see ci.yml)
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/check-lighthouse.ts'
      - 'scripts/lib/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-lighthouse.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/check-lighthouse.ts'
      - 'scripts/lib/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse, SEO at 100
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Both apps build from the compiled dataset.
          submodules: true

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      # Lighthouse is a pinned devDependency run under Node, so the job needs Node on PATH.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build the SRS app
        run: bun run --cwd apps/gokan-srs build

      - name: Build the dictionary
        run: bun run --cwd apps/gokan-dictionary build

      - name: Lighthouse
        run: bun run check:lighthouse

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore

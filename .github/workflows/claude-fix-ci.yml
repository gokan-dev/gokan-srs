# Runs Claude to fix a PR whose CI just failed. Triggered by the CI workflows
# completing with a failure conclusion: no polling, fires only on an actual
# red build.
name: "Agent: fix PR CI"

on:
  workflow_run:
    # Watch the CI workflows that run on pull_request. Names must match the
    # `name:` field of each workflow exactly.
    workflows:
      - "CI: checks"
      - "Deploy: production"
      - "CI: gokan-dictionary"
    types: [completed]

concurrency:
  group: claude-fix-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  fix:
    # Only on failure, only for PR-triggered runs, only for PRs from a branch in
    # THIS repo (not a fork): on a public repo, gating out forks stops an
    # untrusted contributor's failing fork PR from driving the agent with secrets
    # in scope. And skip runs the bot itself started, so a bot push that re-fails
    # CI can't loop forever. The actor check alone no longer covers that:
    # claude-implement-issue.yml pushes with a personal access token, so its runs
    # have a human actor while its commits are still authored as claude[bot].
    # Checking the commit author too keeps this agent from starting on a branch the
    # implement agent is still pushing to.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'claude[bot]' &&
      github.event.workflow_run.head_commit.author.name != 'claude[bot]'
    runs-on: ubuntu-latest
    # One agent per branch at a time (AGENTS.md): every agent job that can push queues here.
    concurrency:
      group: agent-branch-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      id-token: write       # OIDC exchange for the Claude GitHub App installation token
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          submodules: true
          fetch-depth: 0

      # The branch lock can make this run wait behind another agent, whose push gets its own CI
      # run. If the branch moved past the commit that failed, that newer run decides: a failure
      # there starts a fresh fix.
      - name: Skip if the branch moved past the failed commit
        id: head
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$FAILED_SHA" ]; then
            echo "fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "fix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.head.outputs.fix == 'true'
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.head.outputs.fix == 'true'
        run: bun install

      - name: Run Claude
        id: claude
        if: steps.head.outputs.fix == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub-side auth via the installed Claude GitHub App (see claude-implement-issue.yml).
          prompt: |
            CI failed on branch `${{ github.event.workflow_run.head_branch }}`
            (workflow "${{ github.event.workflow_run.name }}",
            run ${{ github.event.workflow_run.html_url }}).

            Find the open PR for this branch. Read the failing job logs, reproduce the
            failure locally where possible (bun run check), fix the
            root cause, not the symptom, and push the fix to the same branch.
            Follow AGENTS.md: fix the code, never relax a rule or add an exemption. Leave a short PR comment summarising what was wrong and
            what you changed. If you cannot fix it within a reasonable attempt, comment
            on the PR explaining the blocker instead of pushing a speculative change.
          claude_args: "--model claude-opus-5-5 --max-turns 200 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

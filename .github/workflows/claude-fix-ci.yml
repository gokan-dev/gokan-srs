# Runs Claude to fix a PR whose CI just failed. Triggered by the CI workflows completing: no polling,
# and only a failure takes the branch lock.
#
# Whether a run starts the agent is scripts/fix-ci-gate.ts (its rules in scripts/lib/fixCiGate.ts, with
# tests): a failure on a branch of this repository with an open, non-draft PR, still at the branch head.
# Agent commits are fixed too, since nearly every failure on an agent branch is one (PR #265's red
# "CI: gokan-dictionary" waited 3 hours behind the old author filter). The loop guard is a count
# instead: one attempt a commit, marked on the PR, and after three attempts in a row with no triage,
# decision or word from the maintainer, the maintainer is asked.
name: "Agent: fix PR CI"

on:
  workflow_run:
    # Every workflow that verifies a branch; names must match each workflow's `name:` exactly. CI runs
    # on push, so the run carries no PR: the gate finds it by its head branch.
    workflows:
      - "CI: checks"
      - "CI: gokan-dictionary"
      - "CI: site"
    types: [completed]

# No workflow-level group: a sibling CI run finishing green on the same branch used to cancel a fix
# that had already started (cancel-in-progress). A green run now skips at the gate job's `if` and never
# reaches the branch lock.

# What scripts/fix-ci-gate.ts reads, in both jobs.
env:
  RUN_ID: ${{ github.event.workflow_run.id }}
  RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  RUN_EVENT: ${{ github.event.workflow_run.event }}
  RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
  RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
  RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  RUN_URL: ${{ github.event.workflow_run.html_url }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  AGENT_HUMAN: ${{ vars.AGENT_HUMAN }}

jobs:
  gate:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      # The default branch's scripts: a PR branch cut before the gate existed has none.
      - name: Checkout the gate
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version
      - name: Decide
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/fix-ci-gate.ts --mode check

  fix:
    needs: gate
    if: needs.gate.outputs.decision != 'skip'
    runs-on: ubuntu-latest
    # One agent per branch at a time (AGENTS.md): every agent job that can push queues here.
    concurrency:
      group: agent-branch-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      actions: read         # bun run ci:wait reads CI's runs on the pushed head
      id-token: write       # OIDC exchange for the Claude GitHub App installation token
    steps:
      - name: Checkout the gate
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      # Decided again under the lock, which may have waited behind another agent: the branch may have
      # moved, or another failed workflow on the same commit may have had its attempt. Records this
      # attempt on the PR (or asks the maintainer when the attempts in a row ran out).
      - name: Claim the attempt
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/fix-ci-gate.ts --mode claim

      - name: Checkout PR branch
        if: steps.claim.outputs.decision == 'fix'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        if: steps.claim.outputs.decision == 'fix'
        run: bun install

      - name: Run Claude
        id: claude
        if: steps.claim.outputs.decision == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub-side auth via the installed Claude GitHub App (see claude-implement-issue.yml).
          prompt: |
            CI failed on branch `${{ github.event.workflow_run.head_branch }}`, PR #${{ steps.claim.outputs.pr }}
            (workflow "${{ github.event.workflow_run.name }}", run ${{ github.event.workflow_run.html_url }},
            commit `${{ github.event.workflow_run.head_sha }}`).

            Start with `bun run ci:wait`: it waits for every CI workflow on this commit and prints each
            failed job's log. Fix every failure it shows in one push: no other fix run starts on this commit.
            Fix the root cause, not the symptom, and follow AGENTS.md: fix the code, never relax a rule or
            add an exemption.

            While iterating, run only the narrow command that covers the failure (the one workspace's tests,
            `bun run typecheck`, `bun run lint`, the one check script), never the whole `bun run check` or a
            production build: CI is the gate. Push to the same branch, then `bun run ci:wait` again on the new
            head; repeat until it passes. Never end the session while a command you started is still
            running.

            Leave a short PR comment summarising what was wrong and what you changed. If you cannot fix it
            within a reasonable attempt, comment on the PR explaining the blocker instead of pushing a
            speculative change. Do not tag.
          claude_args: "--model claude-opus-5-5 --max-turns 200 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

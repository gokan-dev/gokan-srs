# The project rules, on every push and pull request: `bun run check` runs the conventions
# check, lint, typecheck, tests, the duplicate check and the unused-code check (AGENTS.md).
# No path filter on purpose: the conventions cover docs, workflows and config too.

name: "CI: checks"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Check
        run: bun run check

# The project rules, on every push and pull request: `bun run check` runs the conventions
# check, lint, typecheck, tests, the duplicate check and the unused-code check (AGENTS.md).
# No path filter on purpose: the conventions cover docs, workflows and config too.

name: "CI: checks"

on:
  push:
    # Branches only. A tag push ignores path filters, so every rc tag re-ran CI on a commit its
    # branch had already passed: twice the runs, and a second chance for a flaky runner to show a
    # red check on the PR (Lighthouse on v1.25.0-rc.2). Deploy: staging builds the tag itself.
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The real-dataset suites (reported synonym cases, the normalizeGloss pin) fail when
          # the compiled dataset is missing rather than passing vacuously.
          submodules: true

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Check
        run: bun run check

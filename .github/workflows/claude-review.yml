# Reviews a PR's DIFF against the project rules the automated gate cannot express, pre-merge.
# CI ("CI: checks") already runs `bun run check` (conventions, lint, typecheck, tests,
# duplicates, unused): this workflow does NOT repeat any of that. It reads the diff the way a
# human reviewer would and judges what no check catches: design-system adherence, responsive
# intent, visual hierarchy, UI-copy tone, naming through the shared helpers, an architecture
# layer crossed, duplication under the jscpd token threshold.
#
# The reviewer reports and never pushes. Every point, an obvious fix included, goes to
# claude-triage.yml, which decides what is applied and what waits for the maintainer: a fix
# pushed here would start a new round while a decision on the same PR is still open.
#
# The `round` job then ends the review half of the round: an rc tag (staging deploy, then the
# rendered review) when the round's changes ship something, triage straight away otherwise.
name: "Agent: review PR"

on:
  pull_request:
    # `synchronize` re-reviews every push; `ready_for_review` picks up a draft (the staging
    # reviewer opens drafts) the moment it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# No workflow-level group that cancels in progress. A run for a push made while another agent
# held the branch waits its turn, then stands down if the branch has moved on (the first step
# below), since the run for the newer push reviews the same branch.

jobs:
  review:
    # Same-repo branches only: a fork PR must not drive the agent with secrets in scope. Drafts
    # are skipped (the author is still iterating, and the staging reviewer's own drafts are
    # reviewed once they are marked ready, via the `ready_for_review` type above).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The branch lock (AGENTS.md), though this job never pushes: it makes the review wait until
    # the agent pushing to the branch has finished, so it reviews the finished branch.
    concurrency:
      group: agent-branch-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
      queue: max
    # The Claude GitHub App token this job runs on lasts one hour from the Run Claude step: keep
    # this at or under 60.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write  # post the review
      issues: write         # track_progress's tracking comment
      id-token: write       # OIDC exchange for the Claude GitHub App token
    outputs:
      reviewed: ${{ steps.head.outputs.review }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: true
          fetch-depth: 0

      # The branch moved on while this run waited for the lock: the run for the newer push
      # reviews it.
      - name: Skip a moved branch
        id: head
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$EVENT_SHA" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.head.outputs.review == 'true'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.head.outputs.review == 'true'
        run: bun install

      - name: Run Claude
        id: claude
        if: steps.head.outputs.review == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No github_token: the Claude GitHub App token, not AGENT_GITHUB_TOKEN. With the PAT
          # this review posts as a repo member, and on a PR labelled `agent-feedback` every
          # member comment starts claude-address-feedback.yml. claude[bot]'s comments start
          # nothing.
          # The push to review is often an agent's: claude-address-feedback.yml pushes through the
          # app, so the event's actor is claude[bot], and the action refuses a run a bot started
          # unless it is listed.
          allowed_bots: claude
          prompt: |
            Review PR #${{ github.event.pull_request.number }} on branch
            `${{ github.event.pull_request.head.ref }}`. You are reviewing, not implementing a
            feature, and you change nothing: you report. AGENTS.md is already in your context
            (CLAUDE.md imports it), and its rules are what you review against. Read the
            docs/DESIGN_SYSTEM.md and docs/ARCHITECTURE.md sections for the area this PR touches,
            and only those (AGENTS.md says how).

            CI already runs `bun run check` (conventions, lint, typecheck, tests, duplicates,
            unused code) on this PR. Do NOT re-run or re-report any of that. Review ONLY what the
            gate cannot express, reading the diff (`git diff origin/main...HEAD`) as a careful
            human reviewer would:
              - docs/DESIGN_SYSTEM.md adherence: tokens over raw colours, type scale, spacing,
                `rounded-md` vs `rounded-full`, accent only for links/actions, ordinal hues.
              - Responsive intent: layouts that will break at 320/375px, missing `min-w-0`,
                inputs that would be under 16px on phones, tap targets.
              - UI copy: neutral, direct, no cheerleading, no em dashes.
              - Naming a word/kanji/lesson through the shared helpers, not by reading raw fields.
              - Architecture layers (the Exercise engine, `applyEffects`, pure reducers/selectors,
                the one persistence/network layer): a boundary crossed that `check` did not catch.
              - Duplication a human sees that fell under the jscpd token threshold.

            Post ONE PR review listing your findings as numbered points. For each, be concrete:
            file:line, the rule it breaks or the harm it does, and the fix you would make (or the
            options, when there is more than one reasonable fix). Say how sure you are when you
            are not. When a `check-conventions.ts` rule, an ESLint rule or a small test could have
            caught a finding, say so in that point and describe the check (the AGENTS.md
            ratchet). If the diff is clean against the rules the gate cannot express, approve with
            a one-line note.

            Do not commit, push or open a PR: a triage step reads your review with the staging
            review and decides what is applied, so a fix pushed here would start a new round
            ahead of it.

            Hard rules: never push; never touch `.github/workflows/`, secrets or deployment
            config; never write the string `@claude` anywhere (it fires the other agent workflows).
          track_progress: true
          claude_args: "--model claude-opus-5-5 --max-turns 200 --allowedTools Bash,Read,Glob,Grep"

  # Ends the review half of a round. When the round's changes ship something (since the branch's
  # last rc, or since `main` for the first round), it tags the next rc: the staging deploy and the
  # rendered review follow, and that review hands the round to triage. When they ship nothing
  # (CI, docs, tests), the pages are the ones already reviewed, so the round goes to triage now.
  # The tag is set here, not by the agents, so whether a round reaches staging is one rule
  # (packages/deploy/src/deploymentPaths.ts) rather than a judgement in each prompt.

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

  round:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.reviewed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the tag is pushed with AGENT_GITHUB_TOKEN, so that it deploys
      actions: write        # dispatch claude-triage.yml
      pull-requests: write  # the notice when the review failed
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      HUMAN: ${{ vars.AGENT_HUMAN || github.event.pull_request.user.login }}
      REVIEW: ${{ needs.review.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The tag push authenticates with the PAT alone (a GITHUB_TOKEN tag push deploys nothing).
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Tag an rc, or hand the round to triage
        run: |
          set -euo pipefail
          if [ "$REVIEW" != success ]; then
            {
              echo "<!-- gokan-notice -->"
              echo "@$HUMAN The PR review of \`${SHA:0:10}\` ended with \`$REVIEW\` ($RUN_URL), so this round stops here. Re-run that run to continue."
            } > "$RUNNER_TEMP/notice.md"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
            exit 0
          fi

          # This branch's rc tags only: one reachable from main belongs to a merged PR.
          last="$(git tag --merged "$SHA" --no-merged origin/main --list 'v*-rc.*' --sort=-v:refname | sed -n 1p)"
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$SHA" ]; then
            echo "$last already stages $SHA (tagged by hand): its staging review hands the round to triage."
            exit 0
          fi
          base="${last:-$(git merge-base origin/main "$SHA")}"
          ships="$(git diff --name-only "$base" "$SHA" | bun packages/deploy/scripts/ships-in-deployment.ts)"
          echo "Changes since ${last:-main} ship in a deploy: $ships"

          if [ "$ships" = false ]; then
            gh workflow run claude-triage.yml --repo "$GITHUB_REPOSITORY" \
              -f branch="$BRANCH" -f sha="$SHA" -f staging_review=not-needed
            exit 0
          fi

          if [ -n "$last" ]; then
            next="${last%-rc.*}-rc.$(( ${last##*-rc.} + 1 ))"
          else
            # A new PR's first rc is a new minor: v1.30.0-rc.3 is followed by v1.31.0-rc.1.
            highest="$(git tag --list 'v*.*.*-rc.*' --sort=-v:refname | sed -n 1p)"
            IFS=. read -r major minor _ <<<"${highest#v}"
            next="v$major.$((minor + 1)).0-rc.1"
          fi
          [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: an rc tag pushed without it would not deploy."; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$next" -m "Staging round for PR #$PR" "$SHA"
          git push "https://x-access-token:$AGENT_GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$next"
          echo "Tagged $next on $SHA" >> "$GITHUB_STEP_SUMMARY"

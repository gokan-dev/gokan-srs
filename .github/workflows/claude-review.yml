# Reviews a PR's DIFF against the project rules the automated gate cannot express, pre-merge.
# CI ("CI: checks") already runs `bun run check` (conventions, lint, typecheck, tests,
# duplicates, unused): this workflow does NOT repeat any of that. It reads the diff the way a
# human reviewer would and judges what no check catches: design-system adherence, responsive
# intent, visual hierarchy, UI-copy tone, naming through the shared helpers, an architecture
# layer crossed, duplication under the jscpd token threshold.
#
# The reviewer reports and never pushes. Every point, an obvious fix included, goes to
# claude-triage.yml, which decides what is applied and what waits for the maintainer: a fix
# pushed here would start a new round while a decision on the same PR is still open.
#
# The `round` job then ends the review half of the round: an rc tag (staging deploy, then the
# rendered review) when the round's changes ship something, triage straight away otherwise.
name: "Agent: review PR"

on:
  pull_request:
    # `synchronize` re-reviews every push; `ready_for_review` picks up a draft (the staging
    # reviewer opens drafts) the moment it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# No workflow-level group that cancels in progress. A run for a push made while another agent
# held the branch waits its turn, then stands down if the branch has moved on (the first step
# below), since the run for the newer push reviews the same branch.

jobs:
  review:
    # Same-repo branches only: a fork PR must not drive the agent with secrets in scope. Drafts
    # are skipped (the author is still iterating, and the staging reviewer's own drafts are
    # reviewed once they are marked ready, via the `ready_for_review` type above).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The branch lock (AGENTS.md), though this job never pushes: it makes the review wait until
    # the agent pushing to the branch has finished, so it reviews the finished branch.
    concurrency:
      group: agent-branch-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
      queue: max
    # The Claude GitHub App token this job runs on lasts one hour from the Run Claude step: keep
    # this at or under 60.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write  # post the review
      issues: write         # track_progress's tracking comment
      id-token: write       # OIDC exchange for the Claude GitHub App token
    outputs:
      reviewed: ${{ steps.head.outputs.review }}
      # The action refused to run (see "Stop on a review that did not run"): the round stops, said once.
      unreviewed: ${{ steps.ran.outputs.unreviewed }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: true
          fetch-depth: 0

      # The branch moved on while this run waited for the lock: the run for the newer push
      # reviews it.
      - name: Skip a moved branch
        id: head
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$EVENT_SHA" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Bun
        if: steps.head.outputs.review == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        if: steps.head.outputs.review == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Install dependencies
        if: steps.head.outputs.review == 'true'
        run: bun install

      - name: Run Claude
        id: claude
        if: steps.head.outputs.review == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No github_token: the Claude GitHub App token, not AGENT_GITHUB_TOKEN. With the PAT
          # this review posts as a repo member, and on a PR labelled `agent-feedback` every
          # member comment starts claude-address-feedback.yml. claude[bot]'s comments start
          # nothing.
          # The push to review is often an agent's: claude-address-feedback.yml pushes through the
          # app, so the event's actor is claude[bot], and the action refuses a run a bot started
          # unless it is listed.
          allowed_bots: claude
          prompt: |
            Review PR #${{ github.event.pull_request.number }} on branch
            `${{ github.event.pull_request.head.ref }}`. You are reviewing, not implementing a
            feature, and you change nothing: you report. AGENTS.md is already in your context
            (CLAUDE.md imports it), and its rules are what you review against. Read the
            docs/DESIGN_SYSTEM.md and docs/ARCHITECTURE.md sections for the area this PR touches,
            and only those (AGENTS.md says how).

            CI already runs `bun run check` (conventions, lint, typecheck, tests, duplicates,
            unused code) on this PR. Do NOT re-run or re-report any of that. Review ONLY what the
            gate cannot express, reading the diff
            (`git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`, this PR's base) as a careful
            human reviewer would:
              - docs/DESIGN_SYSTEM.md adherence: tokens over raw colours, type scale, spacing,
                `rounded-md` vs `rounded-full`, accent only for links/actions, ordinal hues.
              - Responsive intent: layouts that will break at 320/375px, missing `min-w-0`,
                inputs that would be under 16px on phones, tap targets.
              - UI copy: neutral, direct, no cheerleading, no em dashes.
              - Naming a word/kanji/lesson through the shared helpers, not by reading raw fields.
              - Architecture layers (the Exercise engine, `applyEffects`, pure reducers/selectors,
                the one persistence/network layer): a boundary crossed that `check` did not catch.
              - Duplication a human sees that fell under the jscpd token threshold.

            Post ONE PR review listing your findings as numbered points. For each, be concrete:
            file:line, the rule it breaks or the harm it does, and the fix you would make (or the
            options, when there is more than one reasonable fix). Say how sure you are when you
            are not. When a `check-conventions.ts` rule, an ESLint rule or a small test could have
            caught a finding, say so in that point and describe the check (the AGENTS.md
            ratchet). If the diff is clean against the rules the gate cannot express, approve with
            a one-line note.

            Do not commit, push or open a PR: a triage step reads your review with the staging
            review and decides what is applied, so a fix pushed here would start a new round
            ahead of it.

            Hard rules: never push; never touch `.github/workflows/`, secrets or deployment
            config; never write the string `@claude` anywhere (it fires the other agent workflows).
          track_progress: true
          claude_args: "--model claude-opus-5-5 --max-turns 200 --allowedTools Bash,Read,Glob,Grep"

      # claude-code-action skips itself, and still succeeds, on a PR that changes a workflow it runs in
      # until that change is on the default branch ("Workflow validation failed"), and then writes no
      # execution file. Before, the round went on with no review in the conversation and triage called
      # it done: PR #283 merged that way. Now the round stops and the maintainer is told to review it.
      # The job still succeeds: a failure would be re-run by claude-retry.yml, skip again, and post the
      # same notice each time.
      - name: Stop on a review that did not run
        id: ran
        if: steps.head.outputs.review == 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HUMAN: ${{ vars.AGENT_HUMAN || github.event.pull_request.user.login }}
        run: |
          # The file scripts/agent-usage.ts reads: written by every run of the agent, by no skip.
          [ -f "$RUNNER_TEMP/claude-execution-output.json" ] && exit 0
          echo "unreviewed=true" >> "$GITHUB_OUTPUT"
          {
            echo "<!-- gokan-notice -->"
            echo "@$HUMAN The PR review of \`${SHA:0:10}\` did not run: claude-code-action refuses a PR that changes a workflow it runs in until that change is on \`main\`. No round continues on its own. Review this PR by hand (for example \`/code-review\`) before merging."
          } | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -

  # Ends the review half of a round. When the round's changes ship something (since the branch's
  # last rc, or since `main` for the first round), it tags the next rc: the staging deploy and the
  # rendered review follow, and that review hands the round to triage. When they ship nothing
  # (CI, docs, tests), the pages are the ones already reviewed, so the round goes to triage now.
  # The tag is set here, not by the agents, so whether a round reaches staging is one rule
  # (packages/deploy/src/deploymentPaths.ts) rather than a judgement in each prompt.

      # Where this run's tokens went (scripts/agent-usage.ts), also when the agent failed. A branch
      # cut before the script existed has nothing to run; a report never fails the job.
      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

  # CI on the reviewed commit, before any rc is tagged. A red head is fix-CI's (claude-fix-ci.yml),
  # whose push is reviewed in turn: tagging it anyway spent a staging deploy, a rendered review and a
  # triage on a commit that could not ship, only for triage to hand the failure back as a round
  # (1.69.0: three rounds on "Layout at phone widths"). Outside the rc lock below, so a member waiting
  # for its CI never holds up another member's tag.
  ci:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.reviewed == 'true' && needs.review.result == 'success' && needs.review.outputs.unreviewed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # the CI runs of the commit
    outputs:
      state: ${{ steps.wait.outputs.state }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The default branch's CI wait, from a worktree of it: a branch cut before it has none.
      - name: Checkout the pipeline scripts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git worktree add --detach "$RUNNER_TEMP/pipeline" "origin/$DEFAULT_BRANCH"
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version
      - name: Wait for CI
        id: wait
        run: |
          set +e
          bun "$RUNNER_TEMP/pipeline/scripts/ci-wait.ts" --sha "$SHA" --timeout 50
          code=$?
          set -e
          # 0 passed, 1 failed; anything else (no run, a timeout) is unknown, and the round goes on as
          # before rather than stalling on a reading it could not make.
          # A run that was cancelled or timed out is not fix-CI's (it acts on `failure` only): the round
          # goes on, and triage sees the check, as before. Only a real failure waits for fix-CI, which
          # hands the commit to triage itself if it pushes nothing.
          if [ "$code" = 1 ]; then
            real="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --json name,conclusion \
              --jq '[.[] | select((.name | startswith("CI:")) and .conclusion == "failure")] | length')"
            [ "$real" -gt 0 ] || code=2
          fi
          case "$code" in
            0) echo "state=passed" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=failed" >> "$GITHUB_OUTPUT"
               echo "CI failed on ${SHA:0:10}: no rc. Fix-CI takes it, and the review of its push goes on." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "state=unknown" >> "$GITHUB_OUTPUT"
               echo "::warning::CI on ${SHA:0:10} could not be read: the round goes on." ;;
          esac

  round:
    needs: [review, ci]
    # Not on a red head (the ci job above); a review that failed still reaches the notice below.
    if: ${{ !cancelled() && needs.review.outputs.reviewed == 'true' && needs.ci.outputs.state != 'failed' }}
    runs-on: ubuntu-latest
    # One rc family at a time: a release's members build in parallel and share one family
    # (vX.Y.Z-rc.N), and two PRs against main each take the next minor, so two rounds ending together
    # would compute the same next tag. The job starts (and so checks out the tags) only once the
    # round before it has pushed its own. The push below also retries with the next number, for a
    # tag pushed by hand meanwhile.
    concurrency:
      group: rc-tag-${{ startsWith(github.event.pull_request.base.ref, 'release/') && github.event.pull_request.base.ref || 'main' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read        # the tag is pushed with AGENT_GITHUB_TOKEN, so that it deploys
      actions: write        # dispatch claude-triage.yml
      pull-requests: write  # the notice when the review failed
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
      PR: ${{ github.event.pull_request.number }}
      HUMAN: ${{ vars.AGENT_HUMAN || github.event.pull_request.user.login }}
      REVIEW: ${{ needs.review.result }}
      UNREVIEWED: ${{ needs.review.outputs.unreviewed }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The tag push authenticates with the PAT alone (a GITHUB_TOKEN tag push deploys nothing).
          persist-credentials: false

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Tag an rc, or hand the round to triage
        run: |
          set -euo pipefail
          # A review the action refused has said so on the PR already.
          [ "$UNREVIEWED" != true ] || exit 0
          if [ "$REVIEW" != success ]; then
            {
              echo "<!-- gokan-notice -->"
              echo "@$HUMAN The PR review of \`${SHA:0:10}\` ended with \`$REVIEW\` ($RUN_URL), so this round stops here. Re-run that run to continue."
            } > "$RUNNER_TEMP/notice.md"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
            exit 0
          fi

          # The PR's base decides the versioning. `main`: each PR is its own next minor (the
          # single-issue flow, unchanged). A release branch `release/X.Y.Z`: every member PR shares
          # the one version X.Y.Z, and its rc tags count up across the whole release, so the sprint
          # ships as one version.
          release_version=""
          case "$BASE" in
            release/*.*.*) release_version="${BASE#release/}" ;;
          esac

          # Already staged this exact commit? Its staging review hands the round to triage.
          if [ -n "$release_version" ]; then
            onsha="$(git tag --points-at "$SHA" --list "v$release_version-rc.*" | sed -n 1p)"
          else
            onsha="$(git tag --points-at "$SHA" --no-merged origin/main --list 'v*-rc.*' | sed -n 1p)"
          fi
          if [ -n "$onsha" ]; then
            echo "$onsha already stages $SHA: its staging review hands the round to triage."
            exit 0
          fi

          # "Ships something" is measured since this branch's own last rc, else since its base.
          last="$(git tag --merged "$SHA" --no-merged "origin/$BASE" --list 'v*-rc.*' --sort=-v:refname | sed -n 1p)"
          diffbase="${last:-$(git merge-base "origin/$BASE" "$SHA")}"
          ships="$(git diff --name-only "$diffbase" "$SHA" | bun packages/deploy/scripts/ships-in-deployment.ts)"
          echo "Changes since ${last:-$BASE} ship in a deploy: $ships"

          if [ "$ships" = false ]; then
            gh workflow run claude-triage.yml --repo "$GITHUB_REPOSITORY" \
              -f branch="$BRANCH" -f sha="$SHA" -f staging_review=not-needed
            exit 0
          fi

          # The next rc, counted from the highest tag in its family (not from this branch's own
          # last one), so a tag another PR took meanwhile is stepped over on a retry.
          next_rc() {
            local family highest
            if [ -n "$release_version" ]; then
              # The release's shared family, across every member.
              family="v$release_version"
            elif [ -n "$last" ]; then
              family="${last%-rc.*}"
            else
              # A new main PR's first rc is a new minor: v1.30.0-rc.3 is followed by v1.31.0-rc.1.
              highest="$(git tag --list 'v*.*.*-rc.*' --sort=-v:refname | sed -n 1p)"
              IFS=. read -r major minor _ <<<"${highest#v}"
              echo "v$major.$((minor + 1)).0-rc.1"
              return
            fi
            highest="$(git tag --list "$family-rc.*" --sort=-v:refname | sed -n 1p)"
            echo "$family-rc.$([ -n "$highest" ] && echo "$(( ${highest##*-rc.} + 1 ))" || echo 1)"
          }
          [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: an rc tag pushed without it would not deploy."; exit 1; }
          remote="https://x-access-token:$AGENT_GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            next="$(next_rc)"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$next" -m "Staging round for PR #$PR" "$SHA"
            # A tag is never overwritten: a push of a name someone else took is refused.
            if git push "$remote" "refs/tags/$next"; then
              echo "Tagged $next on $SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::$next was taken meanwhile (attempt $attempt): taking the next number."
            git tag -d "$next" >/dev/null
            git fetch --force --tags "$remote"
          done
          echo "::error::Could not push an rc tag for $SHA after 5 attempts."
          exit 1

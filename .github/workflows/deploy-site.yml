# Reusable deploy for BOTH apps to ONE environment: the gokan-srs SPA at the site root, and
# gokan-dictionary under /dictionary/.
#
# Why one workflow rather than one per app: both apps read the same compiled dataset from the
# same gokan-dataset submodule checkout, so a single checkout guarantees they ship from one
# dataset version. Two workflows could deploy the app from one commit and the dictionary from
# another, leaving an environment serving two apps built off different datasets.
#
# Why one workflow rather than one per environment: staging and production would otherwise hold
# two copies of this logic and drift apart, which is the same failure one level up. Callers pass
# only what actually differs (bucket, distribution, origin).

name: "Deploy: site"

# Set here, not in the callers: a reusable workflow does not inherit the caller's `env`.
# apps/gokan-srs/vite.config.ts keys off this to skip the vite-plugin-checker typecheck pass
# during a CI build (CI typechecks as its own step), so dropping it would change build behavior.
env:
  NODE_ENV: production

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'Environment label used in the run summary, e.g. "production"'
        type: string
        required: true
      site_origin:
        description: 'Public origin, no trailing slash, e.g. "https://gokan-srs.com". Becomes the dictionary canonical/sitemap host.'
        type: string
        required: true
      s3_bucket:
        description: 'Destination S3 bucket name'
        type: string
        required: true
      aws_region:
        type: string
        required: true
      umami_website_id:
        description: 'Umami Cloud website id. Production only: a build without it has no analytics script, so staging never counts a visit.'
        type: string
        required: false
        default: ''
      ref:
        description: 'Branch, tag or SHA to build. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
      audio_max_uploads:
        description: 'Most audio clips this deploy may write. Only staging passes a raise (the AUDIO_MAX_UPLOADS variable, for a first fill or a voice change); production always runs at the default.'
        type: string
        required: false
        default: '2000'
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      cloudfront_distribution_id:
        required: true
      # The audio key: an IAM user that can list the shared audio bucket and add objects under
      # audio/, nothing else. The site's key above cannot touch that bucket.
      audio_aws_access_key_id:
        required: true
      audio_aws_secret_access_key:
        required: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # One checkout, one submodule pin, therefore one dataset version for both apps.
          # gokan-dataset is public, so no extra credentials are needed.
          submodules: true

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build gokan-srs
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
        run: bun run --cwd apps/gokan-srs build

      # Reads the same dataset/compiled/ tree the step above synced from, and bakes it into
      # ~39k static pages. VITE_SITE_ORIGIN is what makes staging emit staging canonicals
      # instead of claiming to be production.
      - name: Build gokan-dictionary
        env:
          VITE_SITE_ORIGIN: ${{ inputs.site_origin }}
          VITE_UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
        run: bun run --cwd apps/gokan-dictionary build

      # The clips this dataset version names (#164), uploaded before anything naming them is
      # published: the deploy fails rather than ship a dataset whose clips the bucket lacks.
      # upload:audio writes only the committed clips the bucket lacks (fetching just those from
      # Git LFS), never overwrites or deletes, and fails over its cap, the guard against a key
      # bug rewriting the bucket. A first fill or a voice change raises the cap for one staging
      # deploy (audio_max_uploads, above). It runs before the site's credentials are
      # configured, so its own are the only ones in the environment.
      #
      # It must handle a dataset of any age: staging's manual dispatch runs this file from main
      # on any older ref. A dataset from before gokan-dataset#49 commits no clips (and one from
      # before #48 has no upload:audio), so there is nothing to upload; any clip such a dataset
      # names was uploaded by hand. bun run check cannot run a workflow against old refs, so a
      # reviewer of any later step that calls into the dataset checks this by reading.
      - name: Upload the dataset's new audio clips
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.audio_aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.audio_aws_secret_access_key }}
          AWS_REGION: eu-west-3
          AUDIO_BUCKET: ${{ vars.AUDIO_BUCKET }}
          MAX_UPLOADS: ${{ inputs.audio_max_uploads }}
        run: |
          if [ ! -d apps/gokan-srs/dataset/data/audio/clips ]; then
            echo "No committed clips in this dataset version: nothing to upload."
            exit 0
          fi
          bun run --cwd apps/gokan-srs/dataset upload:audio --bucket "$AUDIO_BUCKET" --max-uploads "$MAX_UPLOADS"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}

      # Both sites use the content-addressed upload rather than `aws s3 sync`: it hashes every
      # built file, compares against a manifest stored beside the site in S3, and uploads only
      # what differs. Sync's default mtime comparison re-uploads everything from a fresh CI
      # checkout, and --size-only silently skips edits that keep a file's length (a vocab entry
      # moving from N1 to N5 stayed N1 in production). See packages/deploy/src/deployManifest.ts.
      #
      # Each site prunes only keys its own previous manifest listed, so the app deploy at the
      # bucket root can never delete the dictionary pages under dictionary/.
      - name: Deploy gokan-srs to S3
        run: bun packages/deploy/scripts/deploy-s3.ts --site srs --bucket ${{ inputs.s3_bucket }}

      - name: Deploy gokan-dictionary to S3
        run: bun packages/deploy/scripts/deploy-s3.ts --site dictionary --bucket ${{ inputs.s3_bucket }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "/index.html" "/" "/data/compiled/*" "/dictionary/*"

      - name: Deployment summary
        run: |
          {
            echo "## Deploy: ${{ inputs.environment_name }}"
            echo ""
            echo "**Ref:** ${{ inputs.ref || github.ref_name }}"
            echo "**App:** ${{ inputs.site_origin }}/"
            echo "**Dictionary:** ${{ inputs.site_origin }}/dictionary/"
            echo "**Bucket:** ${{ inputs.s3_bucket }}"
            echo ""
            echo "Both apps built from the same checkout, so they share one dataset version."
            echo ""
            echo "_Live in 1-3 minutes after CloudFront invalidation._"
          } >> $GITHUB_STEP_SUMMARY

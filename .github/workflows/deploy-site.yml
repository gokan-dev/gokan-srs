# Reusable deploy for BOTH apps to ONE environment: the gokan-srs SPA at the site root, and
# gokan-dictionary under /dictionary/.
#
# Why one workflow rather than one per app: both apps read the same compiled dataset from the
# same gokan-dataset submodule checkout, so a single checkout guarantees they ship from one
# dataset version. Two workflows could deploy the app from one commit and the dictionary from
# another, leaving an environment serving two apps built off different datasets.
#
# Why one workflow rather than one per environment: staging and production would otherwise hold
# two copies of this logic and drift apart, which is the same failure one level up. Callers pass
# only what actually differs (bucket, distribution, origin).

name: "Deploy: site"

# Set here, not in the callers: a reusable workflow does not inherit the caller's `env`.
# apps/gokan-srs/vite.config.ts keys off this to skip the vite-plugin-checker typecheck pass
# during a CI build (CI typechecks as its own step), so dropping it would change build behavior.
env:
  NODE_ENV: production

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'Environment label used in the run summary, e.g. "production"'
        type: string
        required: true
      site_origin:
        description: 'Public origin, no trailing slash, e.g. "https://gokan-srs.com". Becomes the dictionary canonical/sitemap host.'
        type: string
        required: true
      s3_bucket:
        description: 'Destination S3 bucket name'
        type: string
        required: true
      aws_region:
        type: string
        required: true
      umami_website_id:
        description: 'Umami Cloud website id. Production only: a build without it has no analytics script, so staging never counts a visit.'
        type: string
        required: false
        default: ''
      ref:
        description: 'Branch, tag or SHA to build. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
      dictionary_rendering:
        description: 'How the dictionary serves its word, kanji and grammar pages: "prerendered" (every page uploaded to S3) or "on-request" (rendered by its server, #209). Must match the environment''s Terraform (dictionary_on_request).'
        type: string
        required: false
        default: 'prerendered'
      dictionary_function:
        description: 'The dictionary server''s Lambda (the Terraform output dictionary_function_name). Required with "on-request".'
        type: string
        required: false
        default: ''
      dictionary_on_request:
        description: '"true" when the environment''s Terraform routes the dictionary''s pages to its server (dictionary_on_request, the *_DICTIONARY_ON_REQUEST variable). Read only to guard the deploy: routing on requires "on-request" rendering, and only then may the pages S3 served be pruned.'
        type: string
        required: false
        default: 'false'
      dictionary_keep_old_pages:
        description: '"true" for the week after the cutover: the pages S3 served stay in the bucket, so routing the dictionary back to S3 (the rollback) serves a complete site. A later deploy without it prunes them.'
        type: string
        required: false
        default: 'false'
      audio_max_uploads:
        description: 'Most audio clips this deploy may write. Only staging passes a raise (the AUDIO_MAX_UPLOADS variable, for a first fill or a voice change); production always runs at the default.'
        type: string
        required: false
        default: '2000'
      invalidate_everything:
        description: '"true" clears the whole distribution with one path (/*) instead of what changed: staging, where a cached page is worth nothing and every path counts against the account''s 1,000 free invalidation paths a month.'
        type: string
        required: false
        default: 'false'
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      cloudfront_distribution_id:
        required: true
      # The audio key: an IAM user that can list the shared audio bucket and add objects under
      # audio/, nothing else. The site's key above cannot touch that bucket.
      audio_aws_access_key_id:
        required: true
      audio_aws_secret_access_key:
        required: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # One checkout, one submodule pin, therefore one dataset version for both apps.
          # gokan-dataset is public, so no extra credentials are needed.
          submodules: true

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build gokan-srs
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
        run: bun run --cwd apps/gokan-srs build

      - name: Check the dictionary's rendering mode
        run: |
          case "${{ inputs.dictionary_rendering }}" in
            prerendered) ;;
            on-request) [ -n "${{ inputs.dictionary_function }}" ] || { echo "::error::on-request needs dictionary_function"; exit 1; } ;;
            *) echo "::error::dictionary_rendering is \"${{ inputs.dictionary_rendering }}\", not prerendered or on-request"; exit 1 ;;
          esac
          # Routed to the server but not rendered by it: the new search index would go up without
          # the server's code, and every entity page would answer 5xx.
          if [ "${{ inputs.dictionary_on_request }}" = "true" ] && [ "${{ inputs.dictionary_rendering }}" != "on-request" ]; then
            echo "::error::the dictionary's pages are routed to its server (dictionary_on_request), so dictionary_rendering must be on-request"; exit 1
          fi

      # On request (#209), the server first: the build for the Lambda, its list pages
      # prerendered and its entity pages left to render, packaged before the static build below
      # replaces build/. run.sh is the Lambda Web Adapter's entry (handler "run.sh"); the
      # package.json marks the bundle as ES modules. Source maps stay out (Lambda takes 50 MB).
      - name: Build and package the dictionary's server
        if: inputs.dictionary_rendering == 'on-request'
        env:
          VITE_SITE_ORIGIN: ${{ inputs.site_origin }}
          VITE_UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
        run: |
          bun run --cwd apps/gokan-dictionary build:on-request
          cd apps/gokan-dictionary/build
          printf '#!/bin/sh\nexec node index.js\n' > run.sh
          chmod 755 run.sh
          printf '{ "type": "module" }\n' > package.json
          zip -q -r -X "$RUNNER_TEMP/dictionary-server.zip" . -x '*.map'
          ls -l "$RUNNER_TEMP/dictionary-server.zip"

      # Reads the same dataset/compiled/ tree as the app, and bakes it into ~40k static pages.
      # VITE_SITE_ORIGIN is what makes staging emit staging canonicals instead of claiming to be
      # production. On request it is still built in full: its pages are not uploaded, but they
      # date the sitemap (each URL's <lastmod> is the day its page's content last changed).
      - name: Build gokan-dictionary
        env:
          VITE_SITE_ORIGIN: ${{ inputs.site_origin }}
          VITE_UMAMI_WEBSITE_ID: ${{ inputs.umami_website_id }}
        run: bun run --cwd apps/gokan-dictionary build

      # The clips this dataset version names (#164), uploaded before anything naming them is
      # published: the deploy fails rather than ship a dataset whose clips the bucket lacks.
      # upload:audio writes only the committed clips the bucket lacks (fetching just those from
      # Git LFS), never overwrites or deletes, and fails over its cap, the guard against a key
      # bug rewriting the bucket. A first fill or a voice change raises the cap for one staging
      # deploy (audio_max_uploads, above). It runs before the site's credentials are
      # configured, so its own are the only ones in the environment.
      #
      # It must handle a dataset of any age: staging's manual dispatch runs this file from main
      # on any older ref. A dataset from before gokan-dataset#49 commits no clips (and one from
      # before #48 has no upload:audio), so there is nothing to upload; any clip such a dataset
      # names was uploaded by hand. bun run check cannot run a workflow against old refs, so a
      # reviewer of any later step that calls into the dataset checks this by reading.
      - name: Upload the dataset's new audio clips
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.audio_aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.audio_aws_secret_access_key }}
          AWS_REGION: eu-west-3
          AUDIO_BUCKET: ${{ vars.AUDIO_BUCKET }}
          MAX_UPLOADS: ${{ inputs.audio_max_uploads }}
        run: |
          if [ ! -d apps/gokan-srs/dataset/data/audio/clips ]; then
            echo "No committed clips in this dataset version: nothing to upload."
            exit 0
          fi
          bun run --cwd apps/gokan-srs/dataset upload:audio --bucket "$AUDIO_BUCKET" --max-uploads "$MAX_UPLOADS"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}

      # What the dictionary's upload is allowed to do, decided once: on request, the bucket gets
      # its files and not its pages (--pages-on-server); the pages S3 served are kept for the
      # rollback week (--keep-removed), or pruned only once CloudFront routes pages to the server
      # (--prune-pages). deploy-s3.ts refuses anything else (deployRefusal), so pruning is never
      # implied.
      - name: Decide the dictionary's upload
        id: dictionary_flags
        run: |
          flags=""
          if [ "${{ inputs.dictionary_rendering }}" = "on-request" ]; then flags="--pages-on-server"; fi
          if [ "${{ inputs.dictionary_keep_old_pages }}" = "true" ]; then flags="$flags --keep-removed"
          elif [ "${{ inputs.dictionary_rendering }}" = "on-request" ] && [ "${{ inputs.dictionary_on_request }}" = "true" ]; then flags="$flags --prune-pages"; fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      # Before anything goes live: a dictionary upload that deploy-s3.ts would refuse stops the
      # deploy here, not after the dataset and the app went up without it (the old server would
      # then read the new dataset under the old search index).
      - name: Check the dictionary's upload would run
        run: bun packages/deploy/scripts/deploy-s3.ts --site dictionary --bucket ${{ inputs.s3_bucket }} ${{ steps.dictionary_flags.outputs.flags }} --dry-run

      # Both sites use the content-addressed upload rather than `aws s3 sync`: it hashes every
      # built file, compares against a manifest stored beside the site in S3, and uploads only
      # what differs. Sync's default mtime comparison re-uploads everything from a fresh CI
      # checkout, and --size-only silently skips edits that keep a file's length (a vocab entry
      # moving from N1 to N5 stayed N1 in production). See packages/deploy/src/deployManifest.ts.
      #
      # Each site prunes only keys its own previous manifest listed, so the app deploy at the
      # bucket root can never delete the dictionary pages under dictionary/ or the dataset under
      # dataset/.
      #
      # The dataset first: it is what the apps read (issue #203), published as it is from the
      # submodule checkout (core files plus the text of the languages an app reads,
      # packages/deploy/src/publishedDataset.ts), so an app never goes live ahead of its data.
      #
      # Each upload appends to one list what CloudFront must stop serving (--invalidations,
      # packages/deploy/src/invalidation.ts): the URLs whose response changed, a site's wildcard
      # past its cap, nothing when a site is unchanged. Invalidation paths are billed past the
      # account's 1,000 free a month, so a deploy changing only the app keeps the dictionary cached.
      - name: Start the invalidation list
        id: invalidation_list
        run: ': > "$RUNNER_TEMP/invalidations.txt"'

      - name: Deploy the dataset to S3
        run: bun packages/deploy/scripts/deploy-s3.ts --site data --bucket ${{ inputs.s3_bucket }} --invalidations "$RUNNER_TEMP/invalidations.txt"

      - name: Deploy gokan-srs to S3
        run: bun packages/deploy/scripts/deploy-s3.ts --site srs --bucket ${{ inputs.s3_bucket }} --invalidations "$RUNNER_TEMP/invalidations.txt"

      # On request, the bucket holds the dictionary's files (assets, the search index, the
      # sitemap) and its server the pages (--pages-on-server). The search index goes up before
      # the server: a server refuses an index of another dataset version (a 5xx, never cached,
      # retried), so the gap is the minute until the new server and the invalidation below.
      - name: Deploy gokan-dictionary to S3
        run: bun packages/deploy/scripts/deploy-s3.ts --site dictionary --bucket ${{ inputs.s3_bucket }} ${{ steps.dictionary_flags.outputs.flags }} --invalidations "$RUNNER_TEMP/invalidations.txt"

      # The dataset cleared, and waited for, before the server's code goes live. The server reads
      # /dataset/ through this distribution and keeps its cross-entity indexes (the kanji list, the
      # grammar order...) for an instance's lifetime: an instance started while an edge still holds
      # an old dataset file would render the pages cleared below from it, and they would stay cached
      # a year (no later deploy clears a page whose bytes it already recorded). Every instance of the
      # new code starts after this, on the new dataset. Staging clears /* at the end instead.
      - name: Clear the dataset before the server
        id: dataset_cleared
        if: inputs.invalidate_everything != 'true'
        run: |
          list="$RUNNER_TEMP/invalidations.txt"
          # The dataset's path as invalidationFor listed it, sent on its own.
          dataset=$(grep -x '/dataset/\*' "$list" || true)
          if [ -z "$dataset" ]; then echo "The dataset did not change."; exit 0; fi
          id=$(aws cloudfront create-invalidation --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "$dataset" --query 'Invalidation.Id' --output text)
          echo "Dataset invalidation $id; waiting for it before the server."
          # The wait needs cloudfront:GetInvalidation on the deploy user; without it, two minutes
          # (longer than an invalidation usually takes), said in the log.
          aws cloudfront wait invalidation-completed --distribution-id ${{ secrets.cloudfront_distribution_id }} --id "$id" \
            || { echo "::warning::could not wait for invalidation $id (cloudfront:GetInvalidation?): pausing two minutes instead"; sleep 120; }
          grep -vx '/dataset/\*' "$list" > "$list.rest" || true
          mv "$list.rest" "$list"
          echo "summary=the dataset first, waited for" >> "$GITHUB_OUTPUT"

      - name: Deploy the dictionary's server
        if: inputs.dictionary_rendering == 'on-request'
        run: |
          aws lambda update-function-code             --function-name "${{ inputs.dictionary_function }}"             --zip-file "fileb://$RUNNER_TEMP/dictionary-server.zip"             --architectures arm64             --query 'CodeSize' --output text
          aws lambda wait function-updated-v2 --function-name "${{ inputs.dictionary_function }}"

      # Last, once the server's code is live: a page cleared before it would be rendered again by
      # the old server and cached for a year.
      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          if [ "${{ inputs.invalidate_everything }}" = "true" ]; then
            paths=("/*")
          else
            mapfile -t paths < <(sort -u "$RUNNER_TEMP/invalidations.txt")
          fi
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "Nothing a visitor can get changed: no invalidation."
            echo "summary=nothing (no file a visitor can get changed)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "${paths[@]}" --query 'Invalidation.Id' --output text
          echo "summary=${#paths[@]} path(s): ${paths[*]}" >> "$GITHUB_OUTPUT"

      # A deploy that failed or was cancelled after an upload stored its manifest would leave the
      # next one seeing nothing changed, and the old responses cached for a year: clear everything
      # (one path), whatever went up.
      - name: Invalidate everything after a failed deploy
        if: (failure() || cancelled()) && steps.invalidation_list.outcome == 'success'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "/*" --query 'Invalidation.Id' --output text

      - name: Deployment summary
        run: |
          {
            echo "## Deploy: ${{ inputs.environment_name }}"
            echo ""
            echo "**Ref:** ${{ inputs.ref || github.ref_name }}"
            echo "**App:** ${{ inputs.site_origin }}/"
            echo "**Dictionary:** ${{ inputs.site_origin }}/dictionary/ (${{ inputs.dictionary_rendering }})"
            echo "**Bucket:** ${{ inputs.s3_bucket }}"
            echo "**Invalidated:** ${{ steps.dataset_cleared.outputs.summary && format('{0}, then ', steps.dataset_cleared.outputs.summary) || '' }}${{ steps.invalidate.outputs.summary }}"
            echo ""
            echo "Both apps built from the same checkout, so they share one dataset version."
            echo ""
            echo "_Live in 1-3 minutes after CloudFront invalidation._"
          } >> $GITHUB_STEP_SUMMARY

# Production deploy: runs every project check (bun run check), then hands both apps to the shared deploy workflow
# (deploy-site.yml), which builds and ships them from one checkout so they can never end up on
# different dataset versions.

name: "Deploy: production"

on:
  push:
    branches:
      - main
    paths:
      - 'apps/gokan-srs/**'
      - 'apps/gokan-dictionary/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'apps/gokan-srs/**'
      - 'apps/gokan-dictionary/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Conventions, lint, typecheck, tests, duplicates, unused code
        run: bun run check

  deploy:
    name: Deploy to production
    needs: test # Only deploy if every check passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment_name: production
      site_origin: https://gokan-srs.com
      s3_bucket: ${{ vars.S3_BUCKET_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudfront_distribution_id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

# Deploys BOTH apps to the staging environment (staging.gokan-srs.com) on every
# release-candidate tag push, e.g. `v1.4.0-rc.1`. Staging is a preview target, so this
# deliberately does NOT gate on the test suite: push an RC to eyeball a change even with work in
# progress. (Production's deploy.yml keeps its test gate.)
#
# The build itself lives in the shared deploy-site.yml, so staging and production cannot drift.
# Staging exists largely to exercise dataset changes before they reach production, and building
# both apps from one checkout here is what makes that check meaningful.

name: "Deploy: staging"

on:
  push:
    tags:
      - '*-rc*'
  # Manual preview of ANY branch/tag/SHA. Dispatch always runs this workflow file from main, so
  # the target ref doesn't need to contain this workflow itself - which is how you preview older
  # feature branches on staging.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build and deploy to staging'
        required: true
        default: 'main'

jobs:
  deploy-staging:
    name: Deploy to staging
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment_name: staging
      site_origin: https://staging.gokan-srs.com
      s3_bucket: ${{ vars.STAGING_S3_BUCKET_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      # A raise for a first fill or a voice change, set for one deploy and deleted after.
      # Production's deploy never passes it, so production always runs at the 2,000 cap.
      audio_max_uploads: ${{ vars.AUDIO_MAX_UPLOADS || '2000' }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudfront_distribution_id: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
      audio_aws_access_key_id: ${{ secrets.AUDIO_AWS_ACCESS_KEY_ID }}
      audio_aws_secret_access_key: ${{ secrets.AUDIO_AWS_SECRET_ACCESS_KEY }}

# Deploys BOTH apps to the staging environment (staging.gokan-srs.com) on every
# release-candidate tag push, e.g. `v1.4.0-rc.1`. Staging is a preview target, so this
# deliberately does NOT gate on the test suite: push an RC to eyeball a change even with work in
# progress. (Production's deploy.yml keeps its test gate.)
#
# The build itself lives in the shared deploy-site.yml, so staging and production cannot drift.
# Staging exists largely to exercise dataset changes before they reach production, and building
# both apps from one checkout here is what makes that check meaningful.
#
# The rendered review of what was deployed (claude-review-staging.yml) is dispatched and awaited by
# this run's second job, not a listener: there is one staging site, and a release's members now
# build in parallel, so a deploy and the review of it hold the site together. The workflow-level group below queues every
# other deploy (and its review) until this run has finished: no member's deploy lands while another
# member's pages are being reviewed.

name: "Deploy: staging"

on:
  push:
    tags:
      - '*-rc*'
  # Manual preview of ANY branch/tag/SHA. Dispatch always runs this workflow file from main, so
  # the target ref doesn't need to contain this workflow itself - which is how you preview older
  # feature branches on staging.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build and deploy to staging'
        required: true
        default: 'main'

# The staging site's lock: one deploy-and-review at a time, the rest waiting in order (none dropped).
concurrency:
  group: staging-site
  cancel-in-progress: false
  queue: max

jobs:
  deploy-staging:
    name: Deploy to staging
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment_name: staging
      site_origin: https://staging.gokan-srs.com
      s3_bucket: ${{ vars.STAGING_S3_BUCKET_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      # A raise for a first fill or a voice change, set for one deploy and deleted after.
      # Production's deploy never passes it, so production always runs at the 2,000 cap.
      audio_max_uploads: ${{ vars.AUDIO_MAX_UPLOADS || '2000' }}
      # One path (/*) per deploy: staging has no cache worth keeping, and its deploys (about 130 a
      # month) share the account's 1,000 free invalidation paths with production's.
      invalidate_everything: 'true'
      # The Chinese section (#170) is served on staging only until gokan-dataset#53 confirms its
      # provisional review; production builds English alone (deploy-site.yml's default).
      dictionary_locales: 'en zh-hans'
      # Set together with STAGING_DICTIONARY_ON_REQUEST, which terraform-staging.yml reads.
      dictionary_rendering: ${{ vars.STAGING_DICTIONARY_RENDERING || 'prerendered' }}
      dictionary_function: ${{ vars.STAGING_DICTIONARY_FUNCTION }}
      dictionary_on_request: ${{ vars.STAGING_DICTIONARY_ON_REQUEST || 'false' }}
      dictionary_keep_old_pages: ${{ vars.STAGING_DICTIONARY_KEEP_OLD_PAGES || 'false' }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudfront_distribution_id: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
      audio_aws_access_key_id: ${{ secrets.AUDIO_AWS_ACCESS_KEY_ID }}
      audio_aws_secret_access_key: ${{ secrets.AUDIO_AWS_SECRET_ACCESS_KEY }}

  # Only a successful deploy is reviewed: a failed one left staging serving something else.
  # Dispatched and waited for, not called: a called workflow sees this run's event, and
  # claude-code-action refuses a `push` (the rc tag). The wait keeps this run, and so the
  # staging-site lock, open until the review has finished; a failed review fails this run, which
  # claude-retry.yml re-runs whole (deploy, then a fresh review).
  review:
    name: Review staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The review's own limit (45 minutes) plus its wait for the branch lock.
    timeout-minutes: 90
    permissions:
      actions: write   # dispatch the review, and cancel it if this wait is cancelled
    env:
      GH_TOKEN: ${{ github.token }}
      # The run-name marker the dispatched run carries, so this wait finds its own review.
      CALLER: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Start the review
        id: start
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # From this run's own workflow files (the tag for a tag push, main for a dispatch), so
          # the review matches the deploy that ran.
          gh workflow run claude-review-staging.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f ref="$REF" -f caller="$CALLER"
          for _ in $(seq 1 30); do
            sleep 10
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude-review-staging.yml \
              --event workflow_dispatch --limit 20 --json databaseId,displayTitle \
              --jq "[.[] | select(.displayTitle | endswith(\"[$CALLER]\"))][0].databaseId // empty")"
            if [ -n "$id" ]; then
              echo "id=$id" >> "$GITHUB_OUTPUT"
              echo "Review run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              exit 0
            fi
          done
          echo "::error::The dispatched staging review did not appear within 5 minutes."
          exit 1
      - name: Wait for the review
        run: gh run watch "${{ steps.start.outputs.id }}" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null
      # A review left running after its wait ends would look at staging without holding it.
      - name: Stop the review with its wait
        if: ${{ !success() && steps.start.outputs.id != '' }}
        run: gh run cancel "${{ steps.start.outputs.id }}" --repo "$GITHUB_REPOSITORY" || true

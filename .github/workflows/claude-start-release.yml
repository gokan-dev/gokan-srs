# The sprint / release orchestrator (optional; the single-issue flow does not touch it). A release
# is a tracking issue: its title carries the version and headline ("Release 1.45.0: Detail pages")
# and its body is an ordered task list of member issues ("- [ ] #172"). Labeling that issue
# `release-ready` cuts a `release/X.Y.Z` branch and builds the members against it, each running the
# normal per-issue round (implement, review, triage, correct) with the release branch as its base.
# Independent members build at once: the pre-flight writes which members wait for which (same files
# or area, or one builds on another), and every member whose waits are merged and that is not
# already in flight (`in-progress`) is dispatched. Triage merges a member into the release branch
# when its round ends `done`; the others still in flight are then synced with the release branch
# (a new round, CI included), so what merges next was tested against what merged before. When the
# last one merges, the fragments assemble into one changelog entry and a single
# `release/X.Y.Z -> main` PR opens for the maintainer. So the maintainer approves once per
# release, not once per feature.
#
# Everything here is keyed off git + the tracker's checkboxes + labels, so a re-run is idempotent
# and a member's own resume (claude-implement-issue.yml's `resume` job / claude-sweep.yml) is
# unaffected. Every job that reads and rewrites the tracker holds its lock,
# `release-tracker-release/X.Y.Z`, so two merges landing together cannot lose a tick or start one
# member twice.
name: "Agent: start/advance release"

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

env:
  # github.token for everything here: dispatching a member (workflow_dispatch) needs Actions
  # permission, which the PAT lacks, and a workflow_dispatch IS an exception to the "GITHUB_TOKEN
  # does not start workflows" rule. The two jobs whose git action must itself trigger a downstream
  # workflow (a member auto-merge -> advance, the release PR -> review) override this with the PAT.
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  HUMAN: ${{ vars.AGENT_HUMAN }}

jobs:
  # 0. Pre-flight: before anything is cut or started, read EVERY member issue and ask the
  #    maintainer, in one round, about every load-bearing decision the issues leave undecided. The
  #    sprint starts only once nothing is open, so a member's precision question never stalls it
  #    mid-flight (the whole reason to ask up front). A member's own step-1 check still runs when it
  #    is built, catching anything that only surfaces in the code; this removes the predictable gaps.
  preflight:
    if: github.event_name == 'issues' && github.event.label.name == 'release-ready'
    runs-on: ubuntu-latest
    # One pre-flight per tracker at a time: a mockup approval re-applying `release-ready` while one
    # runs would otherwise start a second beside it.
    concurrency:
      group: release-preflight-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write   # send members to the designer (claude-mockups.yml)
      id-token: write
    outputs:
      ready: ${{ steps.verdict.outputs.ready }}
      version: ${{ steps.gather.outputs.version }}
      order: ${{ steps.order.outputs.order }}
    env:
      TRACKER: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather the member issues
        id: gather
        run: |
          set -euo pipefail
          version="$(printf '%s' "$TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          [ -n "$version" ] || { echo "::error::Tracker title has no X.Y.Z version: '$TITLE'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          members="$(printf '%s' "$BODY" | grep -oE '^- \[[ xX]\] #[0-9]+' | grep -oE '[0-9]+' || true)"
          [ -n "$members" ] || { echo "::error::Tracker #$TRACKER has no '- [ ] #NNN' member list."; exit 1; }
          echo "members=$(printf '%s' "$members" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          mkdir -p .preflight/context .preflight/out
          for m in $members; do
            gh issue view "$m" --repo "$REPO" --json number,title,body > ".preflight/context/issue-$m.json"
          done

      # The mockup stage (claude-mockups.yml), for every member at once: a member is built only once
      # its mockups are approved or the designer found nothing a learner sees. A member not drawn yet
      # is sent to the designer now; one already waiting is left to its approval, which re-applies
      # `release-ready` here once the last member is settled (.github/actions/mockups-continue).
      - name: Send members to the designer
        id: mockups
        env:
          MEMBERS: ${{ steps.gather.outputs.members }}
        run: |
          set -euo pipefail
          gh label create mockups-pending --repo "$REPO" --force --color FBCA04 --description "Mockups wait for the maintainer's approval" >/dev/null
          gh label create awaiting-mockups --repo "$REPO" --force --color FBCA04 --description "A release waiting for its members' mockups" >/dev/null
          # Marked before any design starts: a design that settles within minutes (nothing a learner
          # sees) finds the tracker waiting, so the last one can restart the release.
          gh issue edit "$TRACKER" --repo "$REPO" --add-label awaiting-mockups
          pending=""
          for m in $MEMBERS; do
            labels="$(gh issue view "$m" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')"
            case ",$labels," in
              *,mockups-approved,*|*,no-mockups,*) ;;
              *,mockups-pending,*) pending="$pending #$m" ;;
              *)
                gh issue edit "$m" --repo "$REPO" --add-label mockups-pending
                gh workflow run claude-mockups.yml --repo "$REPO" -f issue="$m"
                pending="$pending #$m"
                ;;
            esac
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the pre-flight precision check for the release tracked by issue #${{ github.event.issue.number }}
            ("${{ github.event.issue.title }}"). You change nothing and post nothing: you read, and you write
            two files. AGENTS.md is already in your context (CLAUDE.md imports it).

            In `.preflight/context/` there is one `issue-<n>.json` (number, title, body) per member of this
            release. The repository is checked out, so read docs/ARCHITECTURE.md and docs/DESIGN_SYSTEM.md
            (the sections each member touches) and the existing code and conventions.

            For each member, decide - with the SAME bar `claude-implement-issue.yml` uses at its step 1 -
            whether implementing it would force a guess on a LOAD-BEARING product or architecture decision
            that the issue, those docs and the existing conventions leave genuinely undecided. An
            implementation detail an agent can reasonably choose (a layout direction, a name, most visual
            detail) is NOT a precision gap; only a decision whose wrong guess would be costly to undo is.

            Write `.preflight/out/questions.md`: for each member that has a gap, a section
              ### #<n> <title>
              - <the open question, concrete enough to answer>
            A member that is ready gets no section; if every member is ready, write an empty file.

            Write `.preflight/out/ready`: exactly `true` when NO member has a gap, `false` otherwise.

            Write `.preflight/out/order.json`: which members must wait for which, so the independent
            ones are built at the same time. A JSON object with one key per member (its number, as a
            string) whose value lists the members it must wait for until they are merged, e.g.
            `{"170": [], "172": [170], "173": []}`. A member waits for another when both change the
            same files or area (two branches editing one component, screen, workflow or data file
            would conflict or contradict each other), or when it builds on the other (uses what the
            other adds, or the issue says it follows it). Members with no such link wait for none. When
            you are unsure whether two members touch the same area, make the later one in the task
            list wait: a needless wait costs time, a missed one costs a conflict. List every member,
            name only members of this release, and make no cycle. An invalid file makes the release
            build its members one at a time.

            Read only, change nothing, and never write the string `@claude` (it starts other agents).
          claude_args: "--model claude-opus-5-5 --max-turns 120 --allowedTools Read,Glob,Grep,Write"

      - name: Report token usage
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -f scripts/agent-usage.ts ]; then bun scripts/agent-usage.ts >> "$GITHUB_STEP_SUMMARY"; fi

      # The agent's order, checked (every member listed, only members named, no cycle); a missing or
      # invalid one is the serial order, with each reason as a warning on the run.
      - name: Validate the build order
        id: order
        env:
          MEMBERS: ${{ steps.gather.outputs.members }}
        run: |
          set -euo pipefail
          order="$(bun packages/deploy/scripts/release-order.ts validate --members "$MEMBERS" --file .preflight/out/order.json)"
          echo "order=$order" >> "$GITHUB_OUTPUT"
          { echo "### Build order"; bun packages/deploy/scripts/release-order.ts describe --members "$MEMBERS" --order "$order"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on the verdict
        id: verdict
        env:
          MEMBERS: ${{ steps.gather.outputs.members }}
        run: |
          set -euo pipefail
          # Read now, not when the designs were sent: the agent above ran for minutes, and a member may
          # have been settled meanwhile (its continuation found this tracker waiting and did nothing
          # yet, since the release had not been stopped).
          MOCKUPS_PENDING=""
          for m in $MEMBERS; do
            gh issue view "$m" --repo "$REPO" --json labels --jq '[.labels[].name] | any(. == "mockups-approved" or . == "no-mockups")' | grep -q true \
              || MOCKUPS_PENDING="$MOCKUPS_PENDING #$m"
          done
          MOCKUPS_PENDING="${MOCKUPS_PENDING# }"
          answered="$(tr -d '[:space:]' < .preflight/out/ready 2>/dev/null || true)"
          case "$answered" in
            true|false) ;;
            *) echo "::error::The pre-flight wrote no valid verdict: '$answered'."; exit 1 ;;
          esac
          ready=false
          [ "$answered" = true ] && [ -z "$MOCKUPS_PENDING" ] && ready=true
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            gh issue edit "$TRACKER" --repo "$REPO" --remove-label awaiting-mockups >/dev/null 2>&1 || true
            echo "Every member is ready; the release will start."
            exit 0
          fi

          # Not ready: ask everything now, stop the start. Open questions are settled by the maintainer,
          # who re-applies release-ready; mockups waiting for approval re-apply it themselves when the
          # last one is approved (unless a question is still open).
          gh issue edit "$TRACKER" --repo "$REPO" --remove-label release-ready
          {
            echo "<!-- gokan-release-preflight -->"
            echo "@$HUMAN Release **$TITLE** has not started yet."
            if [ "$answered" = false ]; then
              echo
              echo "These members need a decision. Answer by editing each issue's body (the implementation agent reads the body), then re-apply the \`release-ready\` label."
              echo
              cat .preflight/out/questions.md
            fi
            if [ -n "$MOCKUPS_PENDING" ]; then
              echo
              echo "These members wait for their mockups: $MOCKUPS_PENDING. Approve or correct them on each issue.$([ "$answered" = true ] && echo ' The release starts by itself once the last one is approved.')"
            fi
          } | gh issue comment "$TRACKER" --repo "$REPO" --body-file -
          if [ "$answered" = false ]; then
            gh label create needs-precision --repo "$REPO" --force >/dev/null 2>&1 || true
            gh issue edit "$TRACKER" --repo "$REPO" --add-label needs-precision
          else
            # The questions are answered: only the mockups hold the release now, and the last approval
            # restarts it (.github/actions/mockups-continue reads this label).
            gh issue edit "$TRACKER" --repo "$REPO" --remove-label needs-precision >/dev/null 2>&1 || true
          fi
          if [ -n "$MOCKUPS_PENDING" ]; then
            gh label create awaiting-mockups --repo "$REPO" --force --color FBCA04 --description "A release waiting for its members' mockups" >/dev/null
            gh issue edit "$TRACKER" --repo "$REPO" --add-label awaiting-mockups
          fi

  # 1. Cut the release branch and start every member that waits for none (only once pre-flight is
  #    clear).
  start:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # The tracker lock (see the header): a merge's advance cannot read the task list mid-start.
    concurrency:
      group: release-tracker-release/${{ needs.preflight.outputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      TRACKER: ${{ github.event.issue.number }}
      VERSION: ${{ needs.preflight.outputs.version }}
      ORDER: ${{ needs.preflight.outputs.order }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Cut the release branch and record the build order
        run: |
          set -euo pipefail
          branch="release/$VERSION"
          for l in release release-ready in-progress needs-attention pause-automation; do
            gh label create "$l" --repo "$REPO" --force >/dev/null 2>&1 || true
          done
          gh issue edit "$TRACKER" --repo "$REPO" --add-label release --remove-label release-ready >/dev/null

          # Create the branch off main if it does not already exist (re-run safe).
          if ! gh api "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
            main_sha="$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)"
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
            echo "Cut $branch from main ($main_sha)."
          fi

          # The order, where advance reads it back (the newest such comment by this workflow), and
          # in words for the maintainer.
          members="$(printf '%s' "$ORDER" | jq -r 'keys_unsorted | join(" ")')"
          { echo "<!-- gokan-release-order $ORDER -->"
            echo "**Build order** for release **$VERSION** (a member starts once the ones it waits for are merged):"
            echo
            bun packages/deploy/scripts/release-order.ts describe --members "$members" --order "$ORDER"
          } | gh issue comment "$TRACKER" --repo "$REPO" --body-file -

      - name: Start the members that wait for none
        id: members
        uses: ./.github/actions/start-release-members
        with:
          tracker: ${{ env.TRACKER }}
          branch: release/${{ env.VERSION }}

      - name: Tell the maintainer
        env:
          STARTED: ${{ steps.members.outputs.started }}
        run: |
          set -euo pipefail
          if [ -z "$STARTED" ]; then
            echo "No member to start (all merged, or all already in flight)."
            exit 0
          fi
          { echo "<!-- gokan-release version=$VERSION -->"
            echo "@$HUMAN Started release **$VERSION** on \`release/$VERSION\`. Building $(printf '#%s ' $STARTED)now; each other member starts once the ones it waits for are merged. I will open one \`release/$VERSION -> main\` PR when the last lands."
          } | gh issue comment "$TRACKER" --repo "$REPO" --body-file -

  # 2. A member merged into a release branch: tick it off, start every member that was waiting only
  #    for it, or (when none are left) assemble the changelog and open the release PR.
  advance:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    # The tracker lock (see the header): two members merged together tick one after the other, each
    # reading the task list the other wrote.
    concurrency:
      group: release-tracker-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      BRANCH: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    outputs:
      finish: ${{ steps.next.outputs.finish }}
      version: ${{ steps.tick.outputs.version }}
      tracker: ${{ steps.tick.outputs.tracker }}
      sync: ${{ steps.members.outputs.in_flight }}
    steps:
      # The release branch: a merged PR's own merge ref may be gone already.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Tick the member
        id: tick
        run: |
          set -euo pipefail
          version="${BRANCH#release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          member="$(printf '%s' "$HEAD_REF" | grep -oE '[0-9]+$' || true)"
          echo "member=$member" >> "$GITHUB_OUTPUT"

          tracker="$(gh issue list --repo "$REPO" --state open --label release --json number,title \
            | jq -r --arg v "$version" '.[] | select(.title | contains($v)) | .number' | head -1)"
          [ -n "$tracker" ] || { echo "::error::No open release tracker for $version."; exit 1; }
          echo "tracker=$tracker" >> "$GITHUB_OUTPUT"

          # Read under the tracker lock, so this edit is made on the list the last advance wrote.
          if [ -n "$member" ]; then
            body="$(gh issue view "$tracker" --repo "$REPO" --json body --jq .body)"
            body="$(printf '%s' "$body" | sed -E "s/- \[ \] #$member\\b/- [x] #$member/")"
            printf '%s' "$body" | gh issue edit "$tracker" --repo "$REPO" --body-file -
            gh issue edit "$member" --repo "$REPO" --remove-label ready-for-dev --remove-label in-progress >/dev/null 2>&1 || true
          fi

      - name: Start the members whose waits are now merged
        id: members
        uses: ./.github/actions/start-release-members
        with:
          tracker: ${{ steps.tick.outputs.tracker }}
          branch: ${{ env.BRANCH }}

      - name: Report, or finish
        id: next
        env:
          TRACKER: ${{ steps.tick.outputs.tracker }}
          MEMBER: ${{ steps.tick.outputs.member }}
          STARTED: ${{ steps.members.outputs.started }}
          REMAINING: ${{ steps.members.outputs.remaining }}
        run: |
          set -euo pipefail
          if [ -z "$(printf '%s' "$REMAINING" | tr -d ' ')" ]; then
            echo "finish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "finish=false" >> "$GITHUB_OUTPUT"
          if [ -n "$STARTED" ]; then
            gh issue comment "$TRACKER" --repo "$REPO" --body "Member #${MEMBER:-?} merged; building $(printf '#%s ' $STARTED)next."
          else
            gh issue comment "$TRACKER" --repo "$REPO" --body "Member #${MEMBER:-?} merged; still in flight: $(printf '#%s ' $REMAINING)."
          fi

  # 2b. The members still in flight now lag the release branch: merge it into each one's branch, under
  #     that branch's lock (an agent at work there finishes first), with the PAT so the push starts CI
  #     and a new review round. A member is merged only by triage's `done`, after a round, so what
  #     merges next was reviewed and checked against what merged before. A branch already up to date
  #     (or not cut yet: it will be cut from the new tip) is left alone. A conflict is left to the
  #     maintainer: the pre-flight's order is meant to keep members that touch the same files apart.
  sync:
    needs: advance
    if: needs.advance.outputs.sync != '' && needs.advance.outputs.sync != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.advance.outputs.sync) }}
    concurrency:
      group: agent-branch-agent/issue-${{ matrix.member }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    env:
      BRANCH: ${{ github.event.pull_request.base.ref }}
      MEMBER: ${{ matrix.member }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          # The push authenticates with the PAT alone (a GITHUB_TOKEN push starts no CI or review).
          persist-credentials: false

      - name: Merge the release branch into the member's branch
        run: |
          set -euo pipefail
          [ -n "$AGENT_GITHUB_TOKEN" ] || { echo "::error::AGENT_GITHUB_TOKEN is not set: a sync pushed without it would start no round."; exit 1; }
          remote="https://x-access-token:$AGENT_GITHUB_TOKEN@github.com/$REPO.git"
          head="agent/issue-$MEMBER"
          git fetch "$remote" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git fetch "$remote" "+refs/heads/$head:refs/remotes/origin/$head" 2>/dev/null; then
            echo "#$MEMBER has no branch yet: it will be cut from the current $BRANCH."
            exit 0
          fi
          if git merge-base --is-ancestor "origin/$BRANCH" "origin/$head"; then
            echo "$head already holds $BRANCH."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$head" "origin/$head"
          if git merge --no-edit -m "Merge $BRANCH into $head: sync with the members merged since" "origin/$BRANCH"; then
            git push --no-verify "$remote" "HEAD:refs/heads/$head"
            echo "Synced $head with $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort
            gh label create needs-attention --repo "$REPO" --force >/dev/null 2>&1 || true
            gh issue edit "$MEMBER" --repo "$REPO" --add-label needs-attention >/dev/null
            gh issue comment "$MEMBER" --repo "$REPO" --body "<!-- gokan-notice -->
          @$HUMAN \`$head\` conflicts with \`$BRANCH\` after another member merged. Merge \`$BRANCH\` into it and resolve the conflicts, then remove \`needs-attention\`: until then this member is not synced and should not merge."
          fi

  # 3. Last member merged: fold the fragments into one entry and open the single release PR.
  finish:
    needs: advance
    if: needs.advance.outputs.finish == 'true'
    runs-on: ubuntu-latest
    # The branch lock, so this waits behind any member run still finishing on the release branch.
    concurrency:
      group: agent-branch-release/${{ needs.advance.outputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # The PAT so the release PR triggers review, and git push authenticates (see the checkout).
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      VERSION: ${{ needs.advance.outputs.version }}
      TRACKER: ${{ needs.advance.outputs.tracker }}
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          ref: release/${{ needs.advance.outputs.version }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Install dependencies
        run: bun install

      - name: Assemble the changelog and open the release PR
        run: |
          set -euo pipefail
          title="$(gh issue view "$TRACKER" --repo "$REPO" --json title --jq .title)"
          headline="${title#*: }"   # "Release 1.45.0: Detail pages" -> "Detail pages"

          # The script validates the assembled list in-memory (changelogProblems) before writing;
          # the release -> main PR then gets full CI. No build here: it needs the dataset submodule.
          bun apps/gokan-srs/release/assemble-fragments.ts --version "$VERSION" --headline "$headline"

          members="$(gh issue view "$TRACKER" --repo "$REPO" --json body --jq .body \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u)"
          closes="$(for m in $members; do echo "Closes #$m"; done)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --no-verify on the commit skips the pre-commit hook (bun install set core.hooksPath:
          # conventions and ESLint on the staged files), which a commit that only assembles the
          # changelog in this minimal checkout does not need; the release -> main PR gets full CI.
          # On the push it is a no-op now that there is no pre-push hook.
          git commit --no-verify -am "Release $VERSION: assemble the changelog from the sprint's fragments"
          git push --no-verify origin "HEAD:release/$VERSION"

          body="$(printf 'Release **%s**: %s\n\nTracking: #%s\n\n%s\n' "$VERSION" "$headline" "$TRACKER" "$closes")"
          url="$(gh pr create --repo "$REPO" --base main --head "release/$VERSION" \
            --title "Release $VERSION: $headline" --body "$body")"
          gh issue comment "$TRACKER" --repo "$REPO" \
            --body "@$HUMAN All members merged. Release **$VERSION** is ready for your review and one merge: $url"

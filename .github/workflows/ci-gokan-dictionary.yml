name: "CI: gokan-dictionary"

on:
  push:
    branches: ['**']   # not rc tags: their commit was checked on its branch (see ci.yml)
    paths:
      - 'apps/gokan-dictionary/**'
      - 'packages/**'
      # The dataset pointer: a bump changes pages, and check:parity reports which.
      - 'apps/gokan-srs/dataset'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-gokan-dictionary.yml'
  # Push only, never also pull_request (see ci.yml).
  workflow_dispatch:

# A newer push cancels the older run, except on main and release branches (see ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # check:parity's base: the branch's open PR, if any, names the branch it merges into.
      pull-requests: read

    # Every locale, staging's included (#170), for the whole job: the build's own checks (size
    # budgets, served paths, lang attributes) then cover what staging serves, and the builds
    # check:parity starts itself (the base's, the on-request server's) see the same list.
    env:
      VITE_DICTIONARY_LOCALES: en zh-hans

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The build prerenders every page from the compiled dataset. dataset.server.ts can
          # fetch the submodule itself if it's missing, but doing it here keeps the build step's
          # failure modes about the build.
          submodules: true
          # Not fetch-depth 0: the history is 0.8 GB here and 1.3 GB in the dataset, which a full
          # fetch would also pull for the submodule. The parity step deepens it to the merge-base.
          fetch-depth: 1

      # Bun from GitHub Releases + an Actions cache, NOT bun.sh (whose `latest` download 403s
      # intermittently and takes every workflow down). Inline (not a local action) so it does not
      # depend on which branch the agent checks out mid-run.
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Setup Bun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$HOME/.bun/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          if [ -x "$BIN/bun" ]; then "$BIN/bun" --version; exit 0; fi
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
          mkdir -p "$BIN"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
          mv "$RUNNER_TEMP/bun-dl/bun-linux-x64/bun" "$BIN/bun"
          chmod +x "$BIN/bun"
          "$BIN/bun" --version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run --cwd apps/gokan-dictionary build

      # The base this branch is compared with: the merge-base with the branch its open PR merges
      # into (main, or release/X.Y.Z for a sprint member), or with main when it has no PR yet. The
      # merge-base, not the base's tip: what landed on the base since the branch left it is not this
      # branch's change. Asked of GitHub's compare API, with how many commits the branch is ahead,
      # so the shallow clone is deepened just enough for check:parity's own `git merge-base` to
      # find it, never fetched whole. Skipped on main (nothing to compare with) and on a branch with
      # nothing of its own (a release branch just cut). A branch pushed before its PR is opened is
      # compared with main until its next push.
      - name: Parity base
        id: parity
        if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json baseRefName --jq '.[0].baseRefName // empty')"
          base="${base:-main}"
          # By commit, not by name: a release branch's slash would need encoding in the API path.
          tip="$(git ls-remote --exit-code origin "refs/heads/$base" | cut -f1)"
          read -r merge_base ahead < <(gh api "repos/$GITHUB_REPOSITORY/compare/${tip}...${GITHUB_SHA}" --jq '"\(.merge_base_commit.sha) \(.ahead_by)"')
          echo "Base branch: $base, merge-base $merge_base, $ahead commit(s) ahead." >> "$GITHUB_STEP_SUMMARY"
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing of its own to compare: check:parity skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --quiet --deepen="$ahead" origin "$GITHUB_SHA"
          git cat-file -e "${merge_base}^{commit}"
          echo "base=$merge_base" >> "$GITHUB_OUTPUT"

      # Which pages this branch changes, in the job summary: the merge-base against HEAD, so exactly
      # what merging would change. Differences are informational: a PR that says it changes no page
      # is held to it by review, and #199's steps run it with --expect identical. Errors are not: a
      # base that fails to install, build or fetch its dataset, or a missing dist/, turns the job
      # red, so a red step here is the check failing to run, not a regression in the branch. HEAD
      # was built by the step above.
      - name: Pages changed (check:parity)
        if: steps.parity.outputs.base != ''
        env:
          BASE: ${{ steps.parity.outputs.base }}
        run: bun run check:parity --base "$BASE" --no-build

      # The server that renders the entity pages on request runs on Node (24, the function's
      # runtime); the checks above run on Bun.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The pages a server renders on request (#206): HEAD's static build, in dist/ from the Build
      # step, against an on-request build of HEAD served as production will serve it (the list
      # pages static, the word, kanji and grammar point pages rendered from the published dataset
      # over HTTP, under /dictionary/), every file requested and compared. Held to identical:
      # rendering on request changes how a page is made, never what it says.
      - name: Pages rendered on request (check:parity --against-server)
        run: bun run check:parity --against-server --no-build --expect identical

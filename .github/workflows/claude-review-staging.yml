# Reviews the RENDERED site after a staging deploy succeeds: the things a diff cannot show.
# Both of the ways a change reaches staging (the pipeline self-tagging an rc, and a human/local
# agent tagging a branch directly) end in a `*-rc*` tag push that runs "Deploy: staging", so
# hooking this to that deploy nets BOTH paths with no extra discipline on either.
#
# It resolves the deployed commit to its open PR and, if there is none (the local-tag-direct
# path often skips the PR), opens a DRAFT PR so the review always has a home. Then it looks at
# the real pages at phone and desktop widths, light and dark, against docs/DESIGN_SYSTEM.md.
#
# Preventive vs detective: this fires AFTER the deploy, so it is the net for rendered-only issues
# and the local path, NOT the merge gate. The gate is the PR reviewer (claude-review.yml) plus a
# green required `bun run check`; keep branch protection on that, not on this.
name: "Agent: review staging"

on:
  workflow_run:
    workflows: ["Deploy: staging"]   # must match deploy-staging.yml's `name:` exactly
    types: [completed]

concurrency:
  group: claude-review-staging-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    # Only a successful deploy, and only for a commit from THIS repo (forks cannot push tags to
    # the base repo, so staging deploys are always same-repo, but gate it anyway).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write       # push high-confidence fixes to the PR branch
      pull-requests: write  # open the draft PR if needed, post the review
      issues: write
      id-token: write
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          prompt: |
            A staging deploy just succeeded for commit `${{ github.event.workflow_run.head_sha }}`
            (ref `${{ github.event.workflow_run.head_branch }}`). Staging is live at
            https://staging.gokan-srs.com. You are doing a RENDERED review: the responsive and
            visual compliance a code diff cannot show. Read AGENTS.md and docs/DESIGN_SYSTEM.md
            first.

            1. Find the home for this review. Identify the branch that contains
               `${{ github.event.workflow_run.head_sha }}` (`git branch -r --contains <sha>`) and
               the open PR for it (`gh pr list --head <branch>`). If an open PR exists, review
               there. If NONE exists (a branch tagged straight to staging without a PR), open a
               DRAFT PR against `main` for that branch, titled for the staging review, so the
               findings have a home; review on it.

            2. Check the rendered result, not the diff:
               - If `bun run check:layout` exists, run it (it measures the production builds at
                 320/375px: sideways scroll, the 12px floor, 16px inputs, 44px tap targets).
               - Build both apps and drive a headless browser (install Chromium via
                 `bunx playwright install --with-deps chromium` if needed) over the pages this
                 change touches at 320px, 375px and 1280px, in light and dark. Judge against
                 docs/DESIGN_SYSTEM.md: overflow, cramped or doubled spacing, contrast, visual
                 hierarchy, `font-mincho`/`font-gothic` for Japanese, accent only for links.

            3. Report on the PR from step 1. HIGH-CONFIDENCE, actionable rendered bugs: fix on the
               branch, keep `bun run check` green, commit + push, and list what changed. SUBJECTIVE
               calls: advisory comment for the human. If the rendered result is clean, say so in
               one line.

            Hard rules: never push to or merge `main`; never force-push commits you did not create;
            never touch `.github/workflows/`, secrets or deployment config; never write the string
            `@claude`; and never push a new `*-rc*` tag (it would redeploy staging and re-trigger
            this review). Your fix pushes are authored as claude[bot].
          claude_args: "--model claude-sonnet-5 --max-turns 300 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

name: "Set up Bun (cached)"
description: >
  Installs Bun WITHOUT depending on bun.sh, whose `latest` download endpoint 403s intermittently and
  takes every workflow (CI and agents alike) down with it. Instead: resolve the version from the
  GitHub API, restore ~/.bun/bin from the Actions cache, and download from GitHub Releases only on a
  cache miss. A drop-in for oven-sh/setup-bun - it takes the same `bun-version` input - so switching
  is a one-line change per workflow.

inputs:
  bun-version:
    description: "A Bun version (e.g. 1.2.21), or 'latest' to resolve the newest release."
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Resolve the Bun version
      id: v
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        if [ "$REQUESTED" = latest ] || [ -z "$REQUESTED" ]; then
          # The newest release, from the GitHub API (reliable) rather than bun.sh.
          v="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name | sed -E 's/^bun-v//')"
        else
          v="${REQUESTED#bun-v}"
        fi
        [ -n "$v" ] || { echo "::error::could not resolve a Bun version from '$REQUESTED'"; exit 1; }
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Restore Bun from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.version }}

    - name: Install Bun and put it on PATH
      shell: bash
      env:
        VERSION: ${{ steps.v.outputs.version }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        BIN="$HOME/.bun/bin"
        echo "$BIN" >> "$GITHUB_PATH"
        if [ "$HIT" = "true" ] && [ -x "$BIN/bun" ]; then
          echo "Bun $VERSION restored from cache."
          exit 0
        fi
        case "${RUNNER_ARCH:-X64}" in
          ARM64) asset="bun-linux-aarch64" ;;
          *)     asset="bun-linux-x64" ;;
        esac
        url="https://github.com/oven-sh/bun/releases/download/bun-v$VERSION/$asset.zip"
        echo "Cache miss: downloading $url"
        mkdir -p "$BIN"
        # --retry-all-errors so a transient 403/5xx from the release CDN is retried, not fatal.
        curl -fsSL --retry 5 --retry-all-errors "$url" -o "$RUNNER_TEMP/bun.zip"
        unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-dl"
        mv "$RUNNER_TEMP/bun-dl/$asset/bun" "$BIN/bun"
        chmod +x "$BIN/bun"
        "$BIN/bun" --version
